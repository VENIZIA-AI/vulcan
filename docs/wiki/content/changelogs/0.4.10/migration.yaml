shipped-hooks-removed:
  symbols:
    - '@venizia/vulcan/base/hooks/guard-manifest.ts'
    - '@venizia/vulcan/base/hooks/guard-package.ts'
    - '@venizia/vulcan/base/hooks/guard-remote-hosts.ts'
    - '@venizia/vulcan/base/hooks/guard-scripting.ts'
    - '@venizia/vulcan/base/hooks/stop.ts'
    - '@venizia/vulcan/base/hooks/prompt-submit.ts'
    - '@venizia/vulcan/base/hooks/post-tool.ts'
  upgrade:
    steps:
      - 'First edit `.configs/vulcan.config.*` for every other Breaking item of this release that names a key you set (`remoteHosts`, `hooks`, `ci`, `knowledge.syncAreas`, `okf.viz`, `okf.sections`, `owner.report.claimWords`, `owner.report.shortReplyWords`, `guard.writes.trustedScripts`) and fix a theme that fails the contrast check: `vulcan sync` refuses an invalid config and writes nothing, and until it runs the stale guard entries block every call. Do this in a terminal, not through the agent.'
      - 'Run `bun install`, then `bun run vulcan sync` in a terminal, not through the agent. Until sync runs, the `.claude/settings.json` entries of guard-manifest, guard-package and guard-remote-hosts exit 2 on every Bash and write call because their files are gone (only a bare `bun install` passes). If a `prepare` script already runs `vulcan sync`, `bun install` does both.'
      - 'In a project that uses omp or pi, sync copies `base/extensions/vulcan-guards.ts` into the project and leaves a copy that git tracks alone, so the old copy keeps blocking: copy `node_modules/@venizia/vulcan/base/extensions/vulcan-guards.ts` over it.'
      - 'Commit the rewritten `.agents/vulcan.manifest.json`. Sync removes the entries of the seven hooks and keeps a hook of your own on the same event.'
      - 'Replace what a removed hook did if you relied on it: read the manifest check in `vulcan doctor` (run it in CI or your own pre-commit hook) instead of the manifest guard, create packages with `vulcan add`, put host rules in `claude.settings.permissions.ask`, and expect no reply-shape check, per-prompt line or per-tool note.'
      - 'Delete the leftovers `.agents/local/violations.jsonl`, `.agents/local/cache/signals.jsonl` and `.agents/local/cache/replies/` (`vulcan clean --cache --yes` removes the cache ones).'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, run `bun install`, then `bun run vulcan sync`: sync writes the hook entries and the shipped files back.'
  data: '`.agents/local/violations.jsonl` and the per-session reply notes are not written any more and are not restored on a downgrade.'
remote-hosts-key-removed:
  symbols:
    - remoteHosts
  upgrade:
    steps:
      - 'Delete the `remoteHosts` key (`trusted`, `readOnly`, `localFile`) from `.configs/vulcan.config.*`.'
      - 'Delete `.agents/hooks/trusted-hosts.local` and `.agents/hooks/trusted-hosts.local.example` if they exist; the personal file is no longer read.'
      - 'Run `bun run vulcan sync`; it removes the guard entry from `.claude/settings.json` and the `remoteHosts` block from the manifest.'
      - "To keep a question before a command reaches a host, set `claude: { settings: { permissions: { ask: ['Bash(ssh:*)', 'Bash(scp:*)'] } } }` in the config."
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, restore the `remoteHosts` key and the personal hosts file from your history, and run `bun run vulcan sync`.'
  data: 'The personal host list is not read, so the hosts it trusted are no longer trusted by any shipped hook.'
owner-report-keys-removed:
  symbols:
    - claimWords
    - shortReplyWords
  upgrade:
    steps:
      - 'Delete `owner.report.claimWords` and `owner.report.shortReplyWords` from `.configs/vulcan.config.*`.'
      - 'Delete `shortReplyWords` from `.agents/local/profile.json`, or run `vulcan profile reset --yes` and answer the form again.'
      - "Optional: set `owner.report.enforce` (and the profile's `enforce`) to `advise` or delete it if it was `block`: `block` still loads and holds no reply."
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan` and restore the keys you deleted; the reply check that reads them comes back with that release.'
guard-writes-trusted-scripts-removed:
  symbols:
    - guard.writes
    - trustedScripts
  upgrade:
    steps:
      - 'Delete `guard.writes.trustedScripts` from `.configs/vulcan.config.*`, string entries and `{ script, readOnly }` entries alike; the config is refused until it is gone.'
      - "If you relied on the guard to see inside your own deploy or migrate script, add the command that starts it to `guard.writes.commands` (`{ rule, what, pattern }`), or to Claude Code's `permissions.ask`."
      - 'Run `bun run vulcan sync`.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, restore the `trustedScripts` list in `guard.writes`, and run `bun run vulcan sync`.'
hooks-config-key-removed:
  symbols:
    - hooks
    - claude.settings
  upgrade:
    steps:
      - "For each `{ event, matcher, command }` of the `hooks` array in `.configs/vulcan.config.*`, add `claude: { settings: { hooks: { <event>: [{ matcher, hooks: [{ type: 'command', command }] }] } } }` (omit `matcher` when the entry had none), then delete the `hooks` array."
      - 'Run `bun run vulcan sync`; it writes the hook next to the shipped hooks of the same event.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, move each hook back into a `hooks` array of `{ event, matcher, command }`, delete its `claude.settings.hooks` entry, and run `bun run vulcan sync`.'
knowledge-sync-areas-removed:
  symbols:
    - knowledge.syncAreas
  upgrade:
    steps:
      - 'Delete `knowledge.syncAreas` from `.configs/vulcan.config.*` and the map file it pointed to (for example `.agents/knowledge/process/knowledge-sync-areas.md`).'
      - 'Run `bun run vulcan sync`; the manifest loses its `syncAreas` line and the `knowledge-sync` skill links are taken back.'
      - 'Ask the `docs-update` skill to audit the knowledge bundle where you asked for `knowledge-sync`.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, restore the key and the map file, and run `bun run vulcan sync` to link the `knowledge-sync` skill again.'
  data: 'A project that committed its own link or a copy of the `knowledge-sync` skill keeps it, and it no longer matches the package.'
ci-command-removed:
  symbols:
    - ci
    - ci.affected
  upgrade:
    steps:
      - 'Delete the `ci` block (`ci.affected.global`) from `.configs/vulcan.config.*`; the config is refused while it is there.'
      - 'Replace every call of `vulcan ci affected` or `vulcan ci template` in your pipelines with your own change detection.'
      - 'Run `bun run vulcan sync`; the manifest loses its `ci` block.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, restore the `ci` block, and run `bun run vulcan sync`.'
okf-viz-removed:
  symbols:
    - okf.viz
    - okf.sections
    - okf.brand
  upgrade:
    steps:
      - 'Stop running `vulcan x okf viz` and `make okf-viz`; there is no replacement and the make target is gone with this version.'
      - 'Delete the generated `.agents/knowledge/viz.html` and any embed of it (a tracked page, a wiki link or frame, a line in `AGENTS.md`).'
      - 'Delete `okf.viz` and `okf.sections` from `.configs/vulcan.config.*`; the config is refused while either is there.'
      - 'If you set `okf.viz.brand`, set the same value as `okf.brand`.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan` and `@venizia/vulcan-okf`, move `okf.brand` back to `okf.viz.brand`, and restore `okf.viz` and `okf.sections` if you used them. Pin both packages together.'
okf-docs-code-rules:
  symbols:
    - okf.check
  upgrade:
    steps:
      - 'Run `vulcan x okf check --strict` and read every `docs-code:` line: it names the page and the line of a code example that has an explicit cast, `any` as a type (in a generic default or bound, an import or export list, or after `satisfies` too), a conditional spread or a string-literal union.'
      - "Rewrite the example: parse or narrow the value instead of `as X`, type the value instead of `any`, build the object and assign the optional key instead of `...(flag ? { a } : {})`, and use a const class and its value type instead of `type Mode = 'a' | 'b'`. `as const` and `import { A as B }` are fine."
      - 'Wrap a real signature quoted from the source in `<!-- docs-code: off -->` and `<!-- docs-code: on -->`; an off region that holds a body, a call or a statement is warned about.'
      - 'A `docs-table:` line is a warning: it never fails the check.'
      - 'This check is not gated by `packs`: it cites `V-C-08` for a string-literal union even in a project that does not follow the `venizia` pack. The only way to leave a quoted example out is a `docs-code: off` region.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan-okf`; its strict check does not read wiki code, so no example needs to change back.'
base-rules-trimmed:
  symbols:
    - '@venizia/vulcan/base/rules.md'
    - digest.oftenDropped
  upgrade:
    steps:
      - 'In `.agents/rules.md`, change `Extends V-W-04` to `Extends V-W-06`, `V-S-07` to `V-S-01`, `V-P-03` to `V-P-02`, `V-P-09` to `V-P-11`, `V-B-01` to `V-B-04`, `V-B-06` to `V-C-11`, `V-C-12` and `V-C-16` to `V-P-08`, and `V-C-19` to `V-C-02`.'
      - 'For `V-P-01`, `V-C-15` and `V-C-17`, which have no successor, drop the `Extends` and keep your rule as a bare id (`P-01`).'
      - 'Search your rules and knowledge pages for the twelve ids: a `V-` id in prose, a bullet or a later table cell is not checked and goes stale without failing.'
      - 'Replace a removed id listed in `digest.oftenDropped` by the rule that took its place: an unknown id is dropped from the `AGENTS.md` block without a message.'
      - 'Run `bun run vulcan sync`, commit the rewritten `AGENTS.md` and manifest, then run `vulcan doctor`; its `rule-ids` check must pass.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, restore the `Extends` lines of the removed ids in `.agents/rules.md`, and run `bun run vulcan sync`.'
venizia-rules-in-a-pack:
  symbols:
    - packs
  upgrade:
    steps:
      - "In a project that follows the Venizia stack (`devz` scripts, bun scripting, verb-first names, const classes, the instance declared before it is awaited), add `packs: ['venizia']` to `.configs/vulcan.config.*`."
      - "Run `bun run vulcan sync` and commit `AGENTS.md` and the manifest; the pack's rules are reported: `V-C-20` as added and `V-B-05`, `V-B-09`, `V-C-07` and `V-C-08` as changed."
      - 'A project that does not follow the stack needs nothing: it has these rules no longer, and a project rule that cites one of them is told which pack holds it.'
  downgrade:
    steps:
      - 'Delete `packs` from the config first (an earlier release refuses the key), then pin the earlier `@venizia/vulcan` and run `bun run vulcan sync`; the five rules are in the base rules again.'
theme-contrast-check:
  symbols:
    - theme.accent
    - theme.tokens
  upgrade:
    steps:
      - 'Run `bun run vulcan sync` or `vulcan doctor`; a theme that fails prints the pair, the colours and the ratio.'
      - "Run `bun run vulcan sync` and read the error: it names the pair, the colours and the ratio. When it names the accent as text on a ground (a light accent such as #3366ff), set `theme.accentText` to a darker colour of the same hue (for example #1d4ed8). When it names `muted` on the soft accent ground, set `theme.tokens.muted: { light: '#5a5a5a' }` (the pair is light mode only; a single value for both modes fails on dark). A darker `accent` does not help: it makes the soft ground darker. Repeat until text is 4.5:1 and marks are 3:1 on every ground."
      - 'Run `bun run vulcan sync` and commit the manifest.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, delete `theme.preset`, `theme.tokens`, `theme.font`, `theme.mono` and `theme.radius` (the earlier release refuses them), and set `theme.accent`, which it requires, if you had none.'
event-add-flow-must-exist:
  symbols:
    - event.add
    - project.key
  upgrade:
    steps:
      - "Set `project: { key: 'KEY' }` (2 to 8 upper-case letters or digits) in `.configs/vulcan.config.*`, then run `bun run vulcan sync`."
      - 'Start a flow with `vulcan event add --kind flow --title <title>` and pass the id it prints (`VULZ-<KEY>-<number>`) to `--flow` in every script, hook or agent rule that wrote `--flow F-<n>`. An `F-<n>` id that a line of the log already carries still works.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`; it accepts any `F-<n>` id. Delete `project.key` from the config first if your earlier release refuses the key.'
atlas-config-values-refused:
  symbols:
    - atlas.sources
    - atlas.tagPattern
    - atlas.legacyTagPatterns
  upgrade:
    steps:
      - 'Change every `atlas.sources` `repo` over `http://`, `git://` or `ext::` to `https://` or `ssh://`, and one that starts with `-` to a real URL or path.'
      - 'Rename an `atlas.sources` `name` that holds a space or another character outside letters, digits, `.`, `_` and `-`, or that does not start with a letter or digit.'
      - 'In `atlas.tagPattern` and `atlas.legacyTagPatterns` replace `<package>` with `<dir>`; only `<dir>`, `<version>`, `<issue>` and `<date>` are allowed.'
      - 'A source that relied on a credential prompt now fails, because git never prompts: before upgrading set up a credential helper, an ssh key or a token for it, and check with `git ls-remote <repo>` in a terminal.'
      - "If a source's tarball is larger than 128 MiB, set `atlas.limits.download` (1 MiB to 1 GiB) after upgrading: an earlier release refuses that key. Run `vulcan doctor` to confirm the config loads."
  downgrade:
    steps:
      - 'Nothing has to change: an earlier release accepts the values you rewrote. Delete `atlas.limits` first, which an earlier release refuses.'
guard-writes-reads-no-scripts:
  symbols:
    - guard.writes
  upgrade:
    steps:
      - "List the command that starts each of your own deploy or migrate scripts (`bun scripts/deploy.ts`, `bash deploy.sh`, a package script) in `guard.writes.commands` as `{ rule: 'V-W-02', what, pattern }`, or in `claude.settings.permissions.ask`, then run `bun run vulcan sync` and commit the manifest."
      - 'Expect no question for what is inside a script: `guard-writes` no longer opens `bun x.ts`, `node x.js`, `bash x.sh` or a package script.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, which reads a script and asks about the deploy or write inside it; delete the entries you added to `guard.writes.commands` only if you do not want them there.'
wiki-links-check-reads-the-layout:
  symbols:
    - '@venizia/vulcan/base/make/vulcan.mk'
  upgrade:
    steps:
      - 'Run `make wiki-links-check` after upgrading. With a `layout` it now also checks the layout folders (`layout.backend`, `layout.frontend`, `layout.shared`) plus `docs/`, `scripts/` and `.agents/`, and no longer checks `packages/` and `examples/` unless they are in `layout.other`.'
      - 'Fix every wiki or knowledge page that names a source path git does not track in a layout folder that was not checked before, or add the folder to `layout.other` to keep it checked.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`; the check reads the earlier folder list again.'
clean-keeps-items-in-use:
  symbols:
    - clean
  upgrade:
    steps:
      - 'A script that emptied `tmp/` or `clones/` with `vulcan clean --yes` adds `--include-fresh`: without it items younger than a day (`tmp/`) or two weeks (`clones/`) are kept and listed.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`. Its `vulcan clean --yes` takes fresh items too, and it refuses `--include-fresh` with `unknown argument`, so remove that flag from the scripts you changed.'
atlas-source-cache-keeps-five-refs:
  symbols:
    - atlas.sources
  upgrade:
    steps:
      - 'Offline, an atlas start for a ref that is not among the last five the source served needs the remote: each remote source keeps only the commits of the five refs it served last. Run `vulcan x atlas pull` online for a ref you need offline.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan-atlas`, whose source cache keeps the commits of every ref it served.'

changelog-reading-keys-required:
  symbols:
    - ChangelogCheck.scan
  upgrade:
    steps:
      - 'Add `summary: <one sentence>` and `highlights:` (a list of one to five one-line points) to the front matter of the `log.md` of the version in progress.'
      - 'Add `steps:` (an ordered list of what an app does) to the `upgrade` of every block of its `migration.yaml`. `before` and `after` may stay beside it.'
      - 'Take the sentence that names `migration.yaml` out of the opening paragraph: the version page links its upgrade guide itself.'
      - 'Run `vulcan changelog check`; it names every missing key and block.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan` and `@venizia/vulcan-atlas`, which do not read `summary` and `highlights`.'
      - 'Where an upgrade holds `steps` with `before` and `after`, keep one of the two: the earlier gate refuses a block that holds both.'
