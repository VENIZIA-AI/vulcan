const-classes-extend-const-class:
  symbols:
    - Corpora.SCHEME_SET
    - AtlasCommands.SCHEME_SET
    - SkillSources.SCHEME_SET
    - PackageKinds.SCHEME_SET
    - LibraryKinds.SCHEME_SET
    - AppSides.SCHEME_SET
    - SourcePins.SCHEME_SET
    - LogLevels.SCHEME_SET
    - ConceptStatuses.SCHEME_SET
    - IssueSeverities.SCHEME_SET
    - ReservedFiles.SCHEME_SET
  upgrade:
    before: |-
      if (Corpora.SCHEME_SET.has(value)) {
        use(value);
      }
      const all = [...Corpora.SCHEME_SET];
    after: |-
      if (Corpora.isValid(value)) {
        use(value);
      }
      const all = Corpora.values();
    steps:
      - 'Replace `X.SCHEME_SET.has(value)` with `X.isValid(value)`: it also narrows `value` to the type of the class values.'
      - 'Replace `[...X.SCHEME_SET]`, a loop over it and `X.SCHEME_SET.size` with `X.values()`, `for (const v of X.values())` and `X.values().length`; the result is a read-only list, copy it if you need to change it.'
  downgrade:
    steps:
      - 'Pin the earlier package and put `X.SCHEME_SET` and `X.isValid` back where you replaced them.'
launch-file-and-loader-variables:
  symbols:
    - BUN_OPTIONS
    - NODE_OPTIONS
    - claude.settings
  upgrade:
    steps:
      - 'Run `bun node_modules/.bin/vulcan sync` in a terminal after upgrading; if `claude.settings.env` in `.configs/vulcan.config.*` sets `BUN_OPTIONS`, `NODE_OPTIONS` or any `BUN_CONFIG_*`, it refuses and names the key.'
      - 'Delete each of those keys from `claude.settings.env` and set it in your shell instead (your shell profile or the command that starts the agent): the hooks no longer pass them on.'
      - 'Run `bun node_modules/.bin/vulcan sync` again and commit `.claude/settings.json` and the manifest.'
      - 'Stop writing `.agents/local/claude.launch.settings.json` from an agent or a script that ran through one: it is protected like the project settings.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`, put the keys back in `claude.settings.env` if you want the agent to receive them, and run `bun node_modules/.bin/vulcan sync`.'
  data: 'A loader variable that was set through `claude.settings.env` is no longer applied to the hooks, so what it changed (a preload, a config file) stops until you set it in your shell.'
guards-read-more-write-forms:
  symbols:
    - tar
    - unzip
    - sed
    - perl
    - truncate
  upgrade:
    steps:
      - 'Run archive extractions in a subfolder instead of the project root: `tar xf a.tar -C dist`, `unzip a.zip -d dist`. A copy, a move, an install, a link or an extraction into the folder of a protected file now asks.'
      - 'Clear `.agents/local/tmp/*` and not `.agents/local/*`: a pattern or `find -delete` or `git clean -x` that can reach a protected file now asks.'
      - 'Expect a question for `sed -i`, `perl -pi`, `truncate`, `tar`, `unzip` and `git init` outside the project, and for an edit in place of a protected file. Codex and Cursor cannot ask on a tool call, so there it is a denial: run the command yourself in a terminal.'
      - 'Do not write `.codex/hooks.json`, `.agents/hooks.json`, `.omp/hooks/pre/vulcan-guards.ts` or `.pi/extensions/vulcan-guards.ts` from an agent: `vulcan sync` writes them.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`; its guards read fewer spellings and ask for none of these.'
guards-read-more-launchers:
  symbols:
    - taskset
    - flock
    - runuser
    - parallel
    - npm
    - pnpm
    - yarn
  upgrade:
    steps:
      - 'Run `make runners-check` after upgrading: it now fails on a `bun create`, an `npm init` with a package name, an `npm`, `pnpm` or `yarn` `create` or a `bun add -g` in your docs or scripts, as it does for `bunx`.'
      - 'For each one it names, add the package to the project dependencies and run its bin from `node_modules/.bin`, or list it in `guard.runners.allow` in `.configs/vulcan.config.*` (for a scaffolder such as `vite`, the name goes there).'
      - 'Run `bun node_modules/.bin/vulcan sync` and commit the manifest.'
      - 'An agent can no longer run a package through `taskset`, `flock`, `runuser`, `parallel`, `su -c`, `script -c` or `find -exec sh -c`: run the package from its bin in `node_modules/.bin` instead.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`; its guards and `runners check` read only the earlier list of launchers. Remove from `guard.runners.allow` only what you added for this release.'
visualize-pages-simplified:
  symbols:
    - titleMuted
    - tiles
    - decisions
  upgrade:
    steps:
      - 'Delete `titleMuted`, `tiles`, `caption` and `language` from each visualize spec; put key numbers in `findings.numbers`, and set the page language in your owner profile (`vulcan profile`).'
      - 'Shorten each title to 60 characters with no status word, each step name to 40 characters and each step note to 80.'
      - 'Rewrite each decision as `{ question, options, why, detail? }`: a question that ends with `?`, two or three options of `{ label, effect, recommended? }` with exactly one recommended, and a reason; move code out of the question and the labels into `detail`.'
      - 'Render again with `bun node_modules/.bin/vulcan visualize <spec> --out <name>`.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`; its renderer reads the earlier spec.'
  data: 'No stored data changes: a rendered page is a file in `.agents/local/prototypes/`, and it is written again by the next render.'
