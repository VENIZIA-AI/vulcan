guards-ask-on-failure:
  symbols: [guard.git, guard.outside]
  upgrade:
    steps:
      - 'Run `vulcan sync` to get the new hook wrappers in `.claude/settings.json`; `vulcan doctor` reports the old ones as stale.'
      - 'A `guard-git` or `guard-outside` hook that crashes, is killed or times out now asks where it let the call through. Claude Code, Antigravity, omp and pi show the ask (Antigravity: `agy --dangerously-skip-permissions` approves it); omp and pi block it when no UI can answer. Codex cannot ask, so there the guard prints a deny and the call is refused. Cursor does not enforce an ask on a tool call.'
      - 'Fix the cause: run `bun install` when the hook cannot load, or set `VULCAN_GUARDS=off` for the session.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan` and run `vulcan sync`: a hook that crashes lets the call through again.'
guards-run-in-listed-agents:
  symbols: [agents]
  upgrade:
    steps:
      - 'Before you run `vulcan sync` on 0.4.5, decide which of omp, pi, Antigravity and Codex keep the guards. Pi loads the extension only after you trust the project, and Codex runs the hook only after you review it in `/hooks`.'
      - 'To opt an agent out, run `vulcan agents remove <agent>` or `vulcan sync --agents <your list without it>`: sync deletes its guard file (or only the VULCAN entry of `.agents/hooks.json` or `.codex/hooks.json`) unless git tracks it or you wrote it. Deleting the agent from `agents` in the config and running a plain `vulcan sync` does not remove the file; it stays and is no longer rewritten.'
      - 'To switch the guards off for one session, set `VULCAN_GUARDS=off`: it switches off `guard-git` and `guard-outside` in all four agents, but in omp and pi the write guards (`guard-writes`, `guard-manifest`, `guard-package`) keep running.'
  downgrade:
    steps:
      - 'Pin the earlier `@venizia/vulcan`. Its `vulcan sync` does not know the four guard files and leaves them in place, so delete them by hand: `.omp/hooks/pre/vulcan-guards.ts`, `.pi/extensions/vulcan-guards.ts`, the `vulcan-guards` entry of `.agents/hooks.json` and the VULCAN entry (matcher `Bash|apply_patch`) of `.codex/hooks.json`. The omp and pi files keep running the earlier guard scripts if you leave them.'
