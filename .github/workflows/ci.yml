name: Checks
# The title of a pull request run is the pull request's title; any other run is titled by its branch.
run-name: '${{ github.event.pull_request.title || github.ref_name }}'

# Every pull request into develop or main runs every gate below, so a defect shows on the pull request and
# not in the release run that would stop on it. There is no push trigger on purpose: a push to develop (the
# release bot's commits included) would pay for the same gates again, and the pull request already ran them.
# A newer push to a pull request cancels its older run. The workflow can still be dispatched by hand.
# Because nothing runs on a push, a pull request that was green is not run again when another one merges
# first; the release workflow runs the gates once more before it publishes.
# Nothing makes this a required status check; that is a repository setting, and it needs both jobs below.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Source gates
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        id: install
        run: bun install

      - name: No agent signature in the branch commits
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make agent-signature-check

      - name: Dependency catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make catalog-check

      # The cli imports atlas's built output (the official presets); the gates below run the cli from source.
      - name: Build atlas
        id: atlas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make atlas

      - name: Knowledge bundle
        if: ${{ !cancelled() && steps.atlas.outcome == 'success' }}
        run: make okf-check-strict

      - name: Agent setup (VULCAN)
        id: sync
        if: ${{ !cancelled() && steps.atlas.outcome == 'success' }}
        run: make vulcan-sync

      # The manifest is generated: a committed copy that differs from what sync wrote is stale or edited by hand.
      - name: Committed manifest matches sync
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: git diff --exit-code -- .agents/vulcan.manifest.json

      - name: Agent setup checks (VULCAN doctor)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: make vulcan-doctor

      - name: Gate scripts' own tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-scripts

  build-and-test:
    name: Build, test and lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        id: install
        run: bun install

      - name: Build
        id: build
        run: make build

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make lint-all

      # The wiki builds, then its two link gates read the build: a source path git does not track, a dead #fragment.
      - name: Wiki links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make docs wiki-links-check wiki-anchors-check

      # The make targets own the test flags (BUN_TEST_FLAGS, default --parallel), so CI and a
      # developer's `make test` run the very same command.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test

      # The packed tarballs, installed alone in an empty project and run.
      - name: Pack smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          make smoke-atlas
          make smoke-cli
