name: Checks
# The title of a pull request run is the pull request's title; any other run is titled by its branch.
run-name: '${{ github.event.pull_request.title || github.ref_name }}'

# Manual only, as in IGNIS. The release workflow runs every gate below before it publishes, so a
# run on every pull request and every push to develop would pay for the same gates twice.
# Nothing enforces this workflow as a required status check, so running it on demand blocks nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Source gates
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: No agent signature in the branch commits
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make agent-signature-check

      - name: Dependency catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make catalog-check

      # The cli imports atlas's built output (the official presets); the gates below run the cli from source.
      - name: Build atlas
        id: atlas
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make atlas

      - name: Knowledge bundle
        if: ${{ !cancelled() && steps.atlas.outcome == 'success' }}
        run: make okf-check-strict

      - name: Agent setup (VULCAN)
        if: ${{ !cancelled() && steps.atlas.outcome == 'success' }}
        run: make vulcan-sync vulcan-doctor

      - name: Gate scripts' own tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-scripts

  build-and-test:
    name: Build, test and lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        id: install
        run: bun install

      - name: Build
        id: build
        run: make build

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make lint-all

      # The wiki builds, then its two link gates read the build: a source path git does not track, a dead #fragment.
      - name: Wiki links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make docs wiki-links-check wiki-anchors-check

      # The make targets own the test flags (BUN_TEST_FLAGS, default --parallel), so CI and a
      # developer's `make test` run the very same command.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test

      # The packed tarballs, installed alone in an empty project and run.
      - name: Pack smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          make smoke-atlas
          make smoke-cli
