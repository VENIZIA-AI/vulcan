name: Atlas index
run-name: 'Atlas index | ${{ inputs.ref || github.ref_name }}'

# Publishes the signed atlas index of each commit atlas can be asked for (the default branch, develop and
# the release tags) to the release `atlas-index` of this repository, so the projects that read VULCAN as a
# source download it instead of building it. The action refuses anything but a push or a manual run on
# those refs and does nothing while the secret ATLAS_INDEX_KEY is empty. It is the local action of this
# commit, never a ref that can move.
#
# A manual run publishes a pair a push never made, for example the release commit and the release tag (the
# release workflow pushes with the Actions token, and GitHub starts no workflow from that push). GitHub runs
# a manual run with the workflow file of the ref it is started on, so start it on develop and give the tag
# as the input: `gh workflow run atlas-index.yml --ref develop -f ref=v0.4.6`. The input is never checked
# out: the checkout is the ref the run started on, and the action refuses a name that is not a plain tag or
# branch, or whose commit is not on the default branch or develop, before it builds anything.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: 'A tag or a branch whose commit to publish instead of the one this run starts on (empty = this run own commit)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: atlas-index-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish the pair
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits and tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      # `vulcan x atlas` runs atlas's built dist.
      - name: Build atlas
        run: make atlas

      - name: Publish the atlas index
        uses: ./.github/actions/atlas-index
        with:
          ref: ${{ inputs.ref }}
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}
