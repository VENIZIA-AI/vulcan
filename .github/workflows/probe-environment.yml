name: 'Probe environment'
run-name: 'Probe environment | ${{ github.ref_name }} | ${{ github.sha }}'

# TEMPORARY. It shows how the release environment treats a run from each ref, before anything depends on it:
# dispatched from develop it must wait for a reviewer; dispatched from another branch it must be refused. It has no
# permission, no secret, no action and no checkout, so a run the environment lets through does nothing. A second pull
# request removes it.
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-26.04
    environment: npm-release

    steps:
      - name: Say where this ran
        run: |
          echo "probe: this job ran on ${GITHUB_REF} at ${GITHUB_SHA}"
