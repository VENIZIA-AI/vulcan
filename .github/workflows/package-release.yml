name: 'NPM Release'
run-name: 'NPM Release | bump: ${{ inputs.bump }} | ${{ github.sha }}'

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Version bump for all three packages (none = publish the version already in package.json)'
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
          - none
        required: true
        default: 'prerelease'
      issue:
        type: string
        description: 'Issue number the release commit serves (prefixes it with [#N])'
        required: false
        default: ''

# The three packages are one release train: one version, one run. `@venizia/vulcan` pins
# `@venizia/vulcan-okf` and `@venizia/vulcan-atlas` to that exact version, so they publish first.
#
# One release at a time, repository-wide: a release mutates `develop` and the registry. A second
# dispatch WAITS (`cancel-in-progress: false`) rather than killing a run that is mid-publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

# Read-only by default; the one job that pushes the release commit and the tag says so for itself. Every job
# runs only for the develop ref and checks out the commit that was dispatched, so what the tests ran on, what
# the approver sees in the run name and what is published are the same commit. The actions and bun are pinned.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUMP: ${{ inputs.bump }}
  PUBLISH_ORDER: 'okf atlas cli'

jobs:
  # Build, lint, the unit tests and VULCAN's own contract, on the dispatched commit, in a job that holds no
  # secret and cannot write: the release job below needs it, so a failing gate publishes nothing.
  test:
    name: Gates
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install

      - name: Build
        run: make build

      - name: Lint
        run: make lint-all

      - name: Dependency catalog
        run: make catalog-check

      - name: Test
        run: make test

      # The contract VULCAN ships, checked on VULCAN itself. CI has no adapters yet, so sync first.
      - name: VULCAN contract
        run: |
          bun x --no-install vulcan sync
          bun x --no-install vulcan doctor
          bun x --no-install vulcan x okf check --strict

  release:
    name: NPM Release
    runs-on: ubuntu-26.04
    needs: test
    if: github.ref == 'refs/heads/develop'
    # The environment holds the release's reviewers (the owner approves each run, on the commit shown in the run name)
    # and its ref rule (develop only): a run waits here before any step of this job starts. Its settings are GitHub's,
    # not this file's; this line is what makes the job subject to them.
    environment: npm-release
    # The release pushes the release commit and the tag, and puts the pair of the tag commit on the release
    # `atlas-index`: both write contents.
    permissions:
      contents: write

    steps:
      # -------------------------------------------------------------------------
      # SETUP
      # -------------------------------------------------------------------------
      # The commit that was dispatched (the head of develop at that moment): the one the test job ran on and
      # the one the run name shows. The release commit is pushed to develop below with a rebase and a retry
      # if develop moved, and the tag goes on the commit as built.
      - name: Checkout the dispatched commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Git
        run: |
          git config user.name "venizia-ci"
          git config user.email "developer@venizia.ai"

      # -------------------------------------------------------------------------
      # VERSION
      # -------------------------------------------------------------------------
      - name: Set the release version
        run: |
          if [ "$BUMP" = "none" ]; then
            NEW_VERSION=$(jq -r .version packages/cli/package.json)
          else
            (cd packages/cli && npm version "$BUMP" --no-git-tag-version --workspaces-update=false > /dev/null)
            NEW_VERSION=$(jq -r .version packages/cli/package.json)

            for directory in okf atlas; do
              (cd "packages/$directory" && npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version --workspaces-update=false > /dev/null)
            done
          fi

          for directory in $PUBLISH_ORDER; do
            VERSION=$(jq -r .version "packages/$directory/package.json")

            if [ "$VERSION" != "$NEW_VERSION" ]; then
              echo "ERROR | packages/$directory is $VERSION, the train is $NEW_VERSION - one version for all three"
              exit 1
            fi
          done

          case "$NEW_VERSION" in
            *-*) NPM_TAG="next" ;;
            *)   NPM_TAG="latest" ;;
          esac

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$NEW_VERSION" >> "$GITHUB_ENV"
          echo "release: v$NEW_VERSION ($BUMP) to the '$NPM_TAG' dist-tag"

      # AFTER the version change: `bun pm pack` resolves `workspace:*` from bun.lock, so a lock that
      # still records the old versions ships a cli pinned to siblings that are not on npm.
      - name: Install
        run: bun install

      # -------------------------------------------------------------------------
      # GATES
      # -------------------------------------------------------------------------
      - name: Build
        run: make build

      # The packed tarballs, installed alone in an empty project. smoke-cli also fails on sibling
      # pins in the packed cli that differ from the train's version.
      - name: Pack smoke
        run: |
          make smoke-atlas
          make smoke-cli

      # Only `bun publish` resolves `catalog:` and `workspace:` while packing; npm ships them
      # verbatim and breaks every consumer.
      - name: Assert the publisher is bun
        run: |
          grep -q 'bun publish' "$GITHUB_WORKSPACE/.github/workflows/package-release.yml" \
            || { echo "ERROR | the publish step must use 'bun publish' - npm ships catalog: verbatim"; exit 1; }

      # The manifest npm receives, not the one in the tree: no unresolved protocol, siblings pinned
      # to this train, and every other runtime dependency served by the registry.
      - name: Validate the packed manifests
        run: |
          for directory in $PUBLISH_ORDER; do
            (cd "packages/$directory" && bun pm pack --quiet > /dev/null)
            TARBALL=$(ls -t packages/$directory/*.tgz | head -1)
            tar -xzOf "$TARBALL" package/package.json > "$RUNNER_TEMP/$directory.manifest.json"
            rm -f "$TARBALL"
          done

          bun -e '
            const directories = process.env.PUBLISH_ORDER.split(" ");
            const version = process.env.NEW_VERSION;
            const problems = [];

            for (const directory of directories) {
              const text = await Bun.file(`${process.env.RUNNER_TEMP}/${directory}.manifest.json`).text();
              const manifest = JSON.parse(text);

              if (/"(catalog|workspace):/.test(text)) {
                problems.push(`${manifest.name}: an unresolved catalog:/workspace: protocol`);
              }

              for (const [name, range] of Object.entries(manifest.dependencies ?? {})) {
                if (name.startsWith("@venizia/vulcan")) {
                  if (range !== version) {
                    problems.push(`${manifest.name}: ${name} pinned ${range}, the train is ${version}`);
                  }

                  continue;
                }

                const response = await fetch(`https://registry.npmjs.org/${name}`);

                if (!response.ok) {
                  problems.push(`${manifest.name}: ${name} is not on the registry (HTTP ${response.status})`);
                  continue;
                }

                const versions = Object.keys((await response.json()).versions ?? {});

                if (!versions.some(candidate => Bun.semver.satisfies(candidate, range))) {
                  problems.push(`${manifest.name}: no published ${name} satisfies ${range}`);
                }
              }
            }

            if (problems.length > 0) {
              console.error("ERROR | the packed manifests cannot be served:");

              for (const problem of problems) {
                console.error(`  ${problem}`);
              }

              process.exit(1);
            }

            console.log(`manifests: ${directories.length} packages resolve`);
          '

      # -------------------------------------------------------------------------
      # PUBLISH - deliberately ahead of every git write
      # -------------------------------------------------------------------------
      # The publish cannot be undone, so it runs first among the mutations: a rejected publish leaves
      # git untouched. A version already on npm is skipped, so a run that failed halfway is retried by
      # dispatching again with bump `none`.
      - name: Publish to NPM
        run: |
          echo "IS_PUBLISHED=true" >> "$GITHUB_ENV"

          for directory in $PUBLISH_ORDER; do
            NAME=$(jq -r .name "packages/$directory/package.json")

            if npm view "$NAME@$NEW_VERSION" version > /dev/null 2>&1; then
              echo "publish: $NAME@$NEW_VERSION is already on npm - skipped"
              continue
            fi

            # --ignore-scripts: the build above already ran; atlas's prepublishOnly would rebuild.
            (cd "packages/$directory" && bun publish --access public --tag "$NPM_TAG" --ignore-scripts)
            echo "publish: $NAME@$NEW_VERSION ($NPM_TAG)"
          done
        env:
          # NPM_CONFIG_TOKEN: bun reads neither NODE_AUTH_TOKEN nor the .npmrc setup-node writes.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # `next` is never below `latest` (it may hold a newer prerelease). A stable release moves `latest`
      # past a stale `next`, so every run - a bump `none` dispatch included, which publishes nothing -
      # moves `next` up to `latest` where it lags. Non-fatal and loud, like IGNIS's `highest` tag: the
      # script prints a warning for every move and every failure and always exits 0. The version just
      # published is passed along because npm serves the old tags for minutes after a publish.
      - name: Keep next at or above latest
        run: |
          NAMES=$(for directory in $PUBLISH_ORDER; do jq -r .name "packages/$directory/package.json"; done)
          bun scripts/release/next-tag.ts --published "$NEW_VERSION" --tag "$NPM_TAG" $NAMES
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # -------------------------------------------------------------------------
      # RECORD IN GIT
      # -------------------------------------------------------------------------
      - name: Commit release
        if: env.BUMP != 'none'
        run: |
          git add packages/*/package.json bun.lock
          SUBJECT="chore(release): v$NEW_VERSION [$BUMP]"

          if [ -n "$RELEASE_ISSUE" ]; then
            SUBJECT="[#$RELEASE_ISSUE] $SUBJECT"
          fi

          git commit -m "$SUBJECT"

          # The tag goes on this commit, as built and published - not on a rebase of it below.
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          RELEASE_ISSUE: ${{ inputs.issue }}

      # develop can move between checkout and push; the version is already on npm, so rebase and retry
      # once instead of leaving develop behind a release that really happened. The rebased commit also
      # carries develop's newer merges, which is why the tag goes on RELEASE_SHA instead.
      - name: Push release
        if: env.BUMP != 'none'
        run: |
          git push origin HEAD:develop || {
            git pull --rebase origin develop
            git push origin HEAD:develop
          }

          echo "IS_PUSHED=true" >> "$GITHUB_ENV"

      # Bump `none` commits nothing, so the checkout is the release. A retry after a finished run finds
      # the tag on origin already: at the release commit it is skipped, anywhere else the run stops.
      - name: Create tag
        run: |
          RELEASE_SHA="${RELEASE_SHA:-$(git rev-parse HEAD)}"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

          REMOTE_TAGS=$(git ls-remote --tags origin "refs/tags/$TAG_NAME*")
          PEELED=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG_NAME^{}" '$2 == ref { print $1 }')
          DIRECT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG_NAME" '$2 == ref { print $1 }')
          REMOTE_SHA="${PEELED:-$DIRECT}"

          if [ "$REMOTE_SHA" = "$RELEASE_SHA" ]; then
            echo "tag: $TAG_NAME is already on origin at $RELEASE_SHA - skipped"
            echo "IS_TAGGED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # A bump `none` dispatch after develop moved on (to heal the dist-tags, say) is not on the release
          # commit, yet the tag may name this very release: accept it when the tagged commit holds this
          # version. A run that committed, or a tag at any other version, still stops.
          if [ -n "$REMOTE_SHA" ] && [ "$BUMP" = "none" ]; then
            TAGGED_VERSION=$(git show "$REMOTE_SHA:packages/cli/package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)

            if [ "$TAGGED_VERSION" = "$NEW_VERSION" ]; then
              echo "tag: $TAG_NAME is already on origin at $REMOTE_SHA, which is version $TAGGED_VERSION - this checkout moved on, the tag is left as it is - skipped"
              echo "IS_TAGGED=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if [ -n "$REMOTE_SHA" ]; then
            echo "TAG_CONFLICT=$REMOTE_SHA" >> "$GITHUB_ENV"
            echo "ERROR | $TAG_NAME is already on origin at $REMOTE_SHA, but this release is $RELEASE_SHA - the tag is left as it is"
            exit 1
          fi

          git tag -a "$TAG_NAME" -m "VULCAN $NEW_VERSION" "$RELEASE_SHA"
          git push origin "$TAG_NAME"

          echo "IS_TAGGED=true" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------------
      # ATLAS INDEX
      # -------------------------------------------------------------------------
      # The push above is made with the Actions token, and GitHub starts no workflow from such a push, so
      # `atlas-index.yml` never runs for the release commit or the tag. The pair of the tag commit is made
      # here instead, from this checkout (full history, develop's refs, the tag just made). It does nothing
      # while ATLAS_INDEX_KEY is empty, refuses a tag whose commit is not on develop (develop moved on during
      # the run and the tag went on the commit as built), and never fails a release that has published.
      - name: Publish the atlas index of the release
        continue-on-error: true
        uses: ./.github/actions/atlas-index
        with:
          ref: ${{ env.TAG_NAME }}
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}

      # -------------------------------------------------------------------------
      # FAILURE REPORTS
      # -------------------------------------------------------------------------
      # Reported, never repaired: npm cannot un-publish, and force-pushing develop to chase a live
      # version does more damage than the mismatch.
      - name: Report - published, develop not updated
        if: failure() && env.IS_PUBLISHED == 'true' && env.IS_PUSHED != 'true' && env.BUMP != 'none'
        run: |
          echo "WARNING | a publish of v$NEW_VERSION was attempted, but develop still records the old version"
          echo "  confirm first: npm view @venizia/vulcan versions"
          echo "  if it IS live: set all three package.json to $NEW_VERSION, run bun install, commit to develop,"
          echo "                 then dispatch with bump 'none' - it publishes whatever is missing and tags"
          echo "  if it is NOT live: nothing to clean up - dispatch again with the same bump"

      - name: Report - tag missing
        if: failure() && env.IS_PUBLISHED == 'true' && env.IS_TAGGED != 'true' && env.TAG_CONFLICT == ''
        run: |
          echo "WARNING | v$NEW_VERSION may be published without its git tag"
          echo "  create it: git tag -a $TAG_NAME -m \"VULCAN $NEW_VERSION\" ${RELEASE_SHA:-<the release commit>} && git push origin $TAG_NAME"
