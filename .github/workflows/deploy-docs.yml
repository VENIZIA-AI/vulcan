name: Docs
run-name: 'Docs · ${{ github.ref_name }}'

# Everything this repository publishes besides the packages, as jobs of one workflow, each with the trigger it had
# when it was a workflow of its own:
#
#   docs         a push to develop that touches docs/wiki/ builds the wiki and deploys it to GitHub Pages
#   atlas-index  a push to main, develop or a tag publishes the signed atlas index of that commit
#   wiki-shared  the weekly run compares the shared wiki theme with IGNIS and ARDOR
#
# A manual run picks one job with `job` (default `docs`, which is what the old deploy workflow did):
#
#   gh workflow run deploy-docs.yml --ref develop
#   gh workflow run deploy-docs.yml --ref develop -f job=atlas-index -f ref=vulcan-v0.4.8
#   gh workflow run deploy-docs.yml --ref develop -f job=wiki-shared
#
# The file keeps its name: the github-pages environment and the release docs name it.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      job:
        type: choice
        description: 'Which job a manual run starts'
        options:
          - docs
          - atlas-index
          - wiki-shared
        required: true
        default: 'docs'
      ref:
        type: string
        description: 'atlas-index only: a tag or a branch whose commit to publish instead of the one this run starts on (empty = this run own commit)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Whether the docs job runs. A path filter on the trigger would stop the other jobs on a push that does not touch
  # the wiki, so the filter is this check: a push to develop deploys when docs/wiki/ changed between the old and
  # the new head (and when the old head cannot be read), a manual run deploys when it asked for `docs`.
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    outputs:
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Does the wiki need a deploy
        id: docs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          JOB: ${{ inputs.job }}
        run: |
          docs=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$JOB" = "docs" ] && docs=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              docs=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docs/wiki; then
              docs=true
            fi
          fi

          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs job: $docs"

  build:
    name: Wiki Release
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Docs
        run: make docs

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/wiki/site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  # Publishes the signed atlas index of each commit atlas can be asked for (the default branch, develop and the
  # release tags) to the release `atlas-index` of this repository, so the projects that read VULCAN as a source
  # download it instead of building it. The action refuses anything but a push or a manual run on those refs and
  # does nothing while the secret ATLAS_INDEX_KEY is empty. It is the local action of this commit, never a ref
  # that can move.
  #
  # A manual run publishes a pair a push never made, for example the release commit and the release tag (the
  # release workflow pushes with the Actions token, and GitHub starts no workflow from that push). GitHub runs a
  # manual run with the workflow file of the ref it is started on, so start it on develop and give the tag as the
  # input. The input is never checked out: the checkout is the ref the run started on, and the action refuses a
  # name that is not a plain tag or branch, or whose commit is not on the default branch or develop, before it
  # builds anything.
  atlas-index:
    name: Publish the pair
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == 'atlas-index')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: atlas-index-${{ inputs.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # The release table is generated from release commits and tags; a shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      # `vulcan x atlas` runs atlas's built dist.
      - name: Build atlas
        run: make atlas

      - name: Publish the atlas index
        uses: ./.github/actions/atlas-index
        with:
          ref: ${{ inputs.ref }}
        env:
          ATLAS_INDEX_KEY: ${{ secrets.ATLAS_INDEX_KEY }}

  # The three wikis (IGNIS, ARDOR, VULCAN) keep identical copies of the shared theme folder. This compares the
  # SHARED.json each repository publishes on develop with the canonical one here and fails when a copy has
  # drifted. It reads two public files; no wiki and no package depends on it.
  wiki-shared:
    name: Compare the copies
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'wiki-shared')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --allow-missing until IGNIS and ARDOR have adopted the folder; remove it when they have.
      - name: Compare with IGNIS and ARDOR
        run: bun scripts/wiki-shared/check.ts --remote --allow-missing
