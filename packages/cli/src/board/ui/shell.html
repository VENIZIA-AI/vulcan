<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <!--BOARD_TOKENS-->
    <style>
      /* One screen: a top bar, then three panes: the agents, the work, and the detail of what was picked. Colours come from the design tokens (the style above); only the mascot keeps its own. Nothing under 13px. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --bar: 56px;
        --control: 32px;
        --line-2: #00000033;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --line-2: #ffffff33;
          color-scheme: dark;
          --face-ink: #f4f4f5;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'],
      :root[data-board-theme='dark'] {
        --line-2: #ffffff33;
        color-scheme: dark;
        --face-ink: #f4f4f5;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --line-2: #00000033;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 14px/1.5 var(--font);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
      }
      .num,
      time {
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .app {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 0 max(16px, env(safe-area-inset-right, 0px)) 16px
          max(16px, env(safe-area-inset-left, 0px));
        gap: 4px;
      }

      /* The top bar. */
      .bar {
        flex: none;
        min-height: var(--bar);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark img {
        display: block;
        height: 28px;
        width: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 24px;
        background: var(--line-2);
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .spacer {
        flex: 1;
      }
      .fresh {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .fresh-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .live-wait .fresh-dot,
      .live-big .fresh-dot {
        background: var(--wait);
      }
      .live-off .fresh-dot {
        background: var(--fail);
      }
      .live-off,
      .live-big {
        color: var(--ink);
      }
      .since {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        min-width: 0;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* One button, one select, one segmented switch: the same height, line and corner everywhere. */
      .btn,
      .c-field select {
        height: var(--control);
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.12s,
          border-color 0.12s;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:hover,
      .c-field select:hover {
        background: var(--soft);
      }
      .btn:active {
        background: var(--sunk);
      }
      .btn[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--ink);
      }
      .btn.sq {
        width: var(--control);
        padding: 0;
      }
      .btn.lang {
        font-weight: 600;
      }
      .btn-text {
        border-color: transparent;
        background: none;
        color: var(--accent-text);
        padding: 0 8px;
      }
      .btn-text:hover {
        background: var(--accent-soft);
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        margin: 0 6px 0 0;
        font: 13px var(--mono);
      }
      .theme svg {
        width: 18px;
        height: 18px;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: var(--r);
        background: var(--soft);
      }
      .seg button {
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: var(--r);
        background: none;
        color: var(--body);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 0.12s,
          color 0.12s;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed='true'] {
        background: var(--bg);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line-2);
      }

      /* The three panes. */
      .c-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 440px;
        gap: 12px;
      }
      .c-main.closed {
        grid-template-columns: 320px minmax(0, 1fr);
      }
      .c-pane {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      .c-pane[hidden] {
        display: none;
      }
      .c-ph {
        flex: none;
        height: 48px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .c-ph h2,
      .c-pt {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
      }
      .c-n {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .c-grow {
        flex: 1;
        min-width: 0;
      }
      .c-x {
        margin-left: auto;
        width: var(--control);
        height: var(--control);
        border-radius: var(--r);
        border: 0;
        background: none;
        color: var(--ink);
        font-size: 15px;
        cursor: pointer;
      }
      .c-x:hover {
        background: var(--soft);
      }
      .c-tg {
        margin-left: auto;
      }
      .c-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .c-tools {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
      }
      .c-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .c-field select {
        padding: 0 8px;
        max-width: 160px;
      }
      .c-empty {
        margin: 0;
        padding: 32px 24px;
        text-align: center;
        color: var(--muted);
      }
      .c-loose {
        display: block;
        width: 100%;
        min-height: 40px;
        padding: 0 16px;
        text-align: left;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
      }
      .c-loose:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .c-loose[aria-pressed='true'] {
        color: var(--ink);
        background: var(--accent-soft);
      }

      /* Groups of the list. */
      .c-gh {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        padding: 0 16px;
        background: var(--head);
        border: 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
      }
      .c-gh .chev {
        width: 12px;
        height: 12px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .c-gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }
      .c-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }

      /* A flow as a card, a line or a table row: one hover, one selection. */
      .row,
      .cell {
        cursor: pointer;
        transition: background-color 0.12s;
      }
      .row:hover,
      .cell:hover {
        background: var(--sunk);
      }
      .row.sel,
      .row.sel:hover,
      .cell.sel,
      .cell.sel:hover {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .c-card {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .c-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 8px;
      }
      .c-badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        border-radius: var(--r);
        padding: 0 6px;
        white-space: nowrap;
      }
      .b-ask {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .b-work {
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .b-idle {
        background: var(--soft);
        color: var(--muted);
      }
      .b-wait {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .b-ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .b-stale {
        color: var(--wait);
        box-shadow: inset 0 0 0 1px var(--wait);
      }
      .c-id {
        font: 13px var(--mono);
        color: var(--muted);
        white-space: nowrap;
      }
      .c-ref {
        color: var(--accent-text);
        font-weight: 600;
        font-size: 13px;
      }
      .unread {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .c-title {
        margin-top: 8px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .c-now {
        margin-top: 2px;
        color: var(--body);
      }
      .c-wb {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 6px 12px;
        font-size: 13px;
      }
      .c-k {
        color: var(--muted);
      }
      .c-v {
        color: var(--ink);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .c-v small {
        color: var(--muted);
        font-size: 13px;
      }
      .c-wait {
        color: var(--ink);
        font-weight: 500;
      }
      .c-mini {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .c-bar {
        display: block;
        flex: 0 0 96px;
        height: 4px;
        background: var(--soft);
        border-radius: 2px;
        overflow: hidden;
      }
      .c-bar span {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .c-chips {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .c-chips span {
        font: 13px/20px var(--mono);
        background: var(--soft);
        border-radius: var(--r);
        padding: 0 6px;
        color: var(--ink);
      }
      .c-chips span.h {
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }
      .c-prs {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .c-pr {
        font: 13px var(--mono);
        color: var(--ink);
        white-space: nowrap;
      }
      .c-pr b {
        margin-left: 6px;
        font: 600 13px var(--font);
      }
      .c-pr .good {
        color: var(--ok);
      }
      .c-pr .bad {
        color: var(--fail);
      }
      .c-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .c-foot b {
        color: var(--body);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .c-r {
        margin-left: auto;
      }

      /* Compact: one line a flow. */
      .c-line {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr) auto 44px 76px;
        align-items: center;
        gap: 12px;
        min-height: 40px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .c-lt {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-lm {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .c-ls {
        text-align: right;
        color: var(--body);
      }
      .c-ago {
        text-align: right;
        color: var(--muted);
        white-space: nowrap;
        font-size: 13px;
      }

      /* Table. */
      .t-wrap {
        overflow-x: auto;
      }
      .t-work {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }
      .t-work th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 0;
        background: var(--head);
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-weight: 600;
        white-space: nowrap;
      }
      .t-work th button {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        height: 40px;
        padding: 0 10px;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        text-align: inherit;
        cursor: pointer;
      }
      .t-work th.num button {
        justify-content: flex-end;
      }
      .t-work th button:hover,
      .t-work th[aria-sort] button {
        color: var(--ink);
      }
      .sort {
        flex: none;
        width: 10px;
        height: 12px;
        opacity: 0.4;
      }
      .sort.on {
        opacity: 1;
      }
      .t-work td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        white-space: nowrap;
        vertical-align: middle;
      }
      .t-work td:first-child,
      .t-work th:first-child button {
        padding-left: 16px;
      }
      .t-work td.c-id {
        color: var(--muted);
      }
      .t-work .num {
        text-align: right;
      }
      .t-title {
        width: 100%;
      }
      .t-title div {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .t-title span:first-child {
        max-width: 40ch;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }
      .t-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .t-who {
        font-family: var(--mono);
      }

      /* Agents. */
      .c-compact {
        display: flex;
        align-items: center;
        gap: 4px 10px;
        padding: 6px 16px;
      }
      .c-compact .c-face {
        width: 44px;
        height: 40px;
      }
      .c-face {
        width: 56px;
        height: 50px;
        flex: none;
      }
      .c-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
      }
      .c-nm {
        font: 600 14px var(--mono);
        color: var(--ink);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-role {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-body {
        display: grid;
        grid-template-columns: 1fr;
        margin-top: 4px;
        font-size: 13px;
      }
      .c-body .c-k {
        margin-top: 6px;
      }
      .cell .c-foot {
        gap: 4px 12px;
      }
      .c-ask {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--fail);
      }

      /* Detail. */
      .d-body {
        padding: 20px;
        line-height: 1.6;
        color: var(--body);
      }
      .d-body h2 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
        overflow-wrap: anywhere;
      }
      .d-meta {
        display: flex;
        gap: 4px 12px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      .d-who {
        font-family: var(--mono);
        color: var(--ink);
      }
      .d-stages {
        display: flex;
        gap: 3px;
        margin: 16px 0 6px;
      }
      .d-stages .st {
        flex: 1;
        height: 6px;
        border-radius: 2px;
        background: var(--soft);
      }
      .d-stages .st.done {
        background: var(--ok);
      }
      .d-stages .st.cur {
        background: var(--wait);
      }
      .d-stl {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }
      .d-stl b {
        color: var(--ink);
        font-weight: 600;
      }
      .d-sec {
        margin-top: 24px;
      }
      .d-sec h3 {
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .d-sec p {
        margin: 0;
        color: var(--ink);
      }
      .d-sec .c-chips {
        margin-top: 8px;
      }
      .d-sec > .c-bar {
        margin: 0 0 8px;
      }
      .d-tokens {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .d-tokens th,
      .d-tokens td {
        padding: 6px 0 6px 12px;
        text-align: right;
        border-bottom: 1px solid var(--line);
        font-weight: 400;
        color: var(--ink);
      }
      .d-tokens thead th {
        color: var(--muted);
      }
      .d-tokens th[scope='row'] {
        padding-left: 0;
        text-align: left;
      }
      .ckl ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .ckl li {
        position: relative;
        padding: 6px 0 6px 26px;
        color: var(--ink);
        border-bottom: 1px solid var(--line);
      }
      .ckl li:last-child {
        border-bottom: 0;
      }
      .ckl li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 10px;
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 1.5px solid var(--line-2);
        border-radius: 3px;
      }
      .ckl li.on {
        color: var(--muted);
      }
      .ckl li.on::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .ckl li.on::after {
        content: '';
        position: absolute;
        left: 4.5px;
        top: 12px;
        width: 4px;
        height: 7px;
        border: solid var(--bg);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .d-waiting {
        display: flex;
        gap: 12px;
        padding: 10px 12px;
        border-radius: var(--r);
        background: var(--wait-soft);
        color: var(--ink);
      }
      .d-k {
        font-weight: 600;
        color: var(--wait);
        white-space: nowrap;
      }
      .d-up {
        border-left: 1px solid var(--line-2);
        margin-left: 4px;
        padding-left: 16px;
      }
      .d-u {
        position: relative;
        margin-bottom: 10px;
        color: var(--ink);
      }
      .d-u::before {
        content: '';
        position: absolute;
        left: -20.5px;
        top: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line-2);
      }
      .d-u.last::before {
        background: var(--wait);
      }
      .d-u time,
      .d-list time {
        font: 13px var(--mono);
        color: var(--muted);
        margin-right: 8px;
      }
      .d-tag {
        font-size: 13px;
        font-weight: 500;
        color: var(--accent-text);
        background: var(--accent-soft);
        border-radius: var(--r);
        padding: 0 6px;
        margin-right: 6px;
      }
      .d-all {
        margin-top: 16px;
      }
      .d-empty {
        margin: 0;
        color: var(--muted);
      }
      .d-note {
        margin-left: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .d-agenthead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .d-agenthead .bot {
        width: 68px;
        height: 60px;
        flex: none;
      }
      .d-list {
        margin: 0;
        padding: 0;
        list-style: none;
        color: var(--ink);
      }
      .d-list li {
        padding: 4px 0;
      }
      .d-list a {
        color: var(--accent-text);
        font-family: var(--mono);
        font-size: 13px;
      }
      .mk {
        width: 10px;
        height: 10px;
        flex: none;
        margin: 0 6px;
      }
      .mk.x {
        color: var(--fail);
      }
      .mk.v {
        color: var(--ok);
      }
      .evs {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .ev {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        column-gap: 10px;
      }
      .ev .tm {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .ev .who {
        font-size: 13px;
        color: var(--muted);
      }
      .ev .who b {
        font: 500 13px var(--mono);
        color: var(--ink);
      }
      .ev .sm {
        color: var(--ink);
      }
      .ev.fail .sm {
        color: var(--fail);
      }
      .ev .lk {
        font-size: 13px;
        color: var(--accent-text);
        text-decoration: none;
        word-break: break-all;
      }
      .ev .lk:hover {
        text-decoration: underline;
      }
      .ev .src {
        font-size: 13px;
        color: var(--muted);
      }
      .keys {
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 0px));
        top: calc(var(--bar) + env(safe-area-inset-top, 0px));
        z-index: 20;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        box-shadow: 0 8px 24px #00000026;
        padding: 12px 16px;
        width: 260px;
      }
      .keys h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .keys dl {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
      }
      .keys dt {
        font-family: var(--mono);
        color: var(--ink);
      }
      .keys dd {
        margin: 0;
      }
      /* The mascots: solid colour, thick outline, round hands. Motion is cheap keyframes and stops for reduced motion. */
      .bot {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .m-o {
        stroke: var(--face-ink);
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .m-line {
        fill: none;
      }
      .m-ink {
        fill: var(--face-ink);
      }
      .m-bad {
        stroke: var(--fail);
      }
      .m-shadow {
        opacity: 0.12;
      }
      .m-q {
        font: 900 13px system-ui;
        fill: #1f1f1f;
      }
      .m-hoe {
        transform-origin: 26px 22px;
        animation: m-swing 1.1s cubic-bezier(0.55, 0, 0.35, 1) infinite;
      }
      .m-dig {
        transform-origin: 20px 36px;
        animation: m-dig 1.1s ease-in-out infinite;
      }
      .m-squint {
        transform-origin: 20px 23px;
        animation: m-squint 1.1s ease-in-out infinite;
      }
      .m-clod {
        opacity: 0;
        animation: m-clod 1.1s ease-out infinite;
      }
      .m-c2 {
        animation-name: m-clod2;
      }
      .m-c3 {
        animation-name: m-clod3;
      }
      .m-sleep {
        transform-origin: 20px 36px;
        animation: m-breathe 3s ease-in-out infinite;
      }
      .m-snot {
        transform-origin: 24.5px 29px;
        animation: m-snot 3s ease-in-out infinite;
      }
      .m-zz {
        font: 900 9px system-ui;
        fill: #3b4cca;
        opacity: 0;
        animation: m-zz 3s ease-in-out infinite;
      }
      .m-z2 {
        font-size: 11px;
        animation-delay: 1s;
      }
      .m-z3 {
        font-size: 13px;
        animation-delay: 2s;
      }
      .m-bubble {
        transform-origin: 35px 6px;
        animation: m-pop 1.8s ease-in-out infinite;
      }
      .m-lean {
        transform-origin: 20px 36px;
        animation: m-lean 1.8s ease-in-out infinite;
      }
      .m-wave {
        transform-origin: 33px 26px;
        animation: m-wave 0.9s ease-in-out infinite;
      }
      @keyframes m-swing {
        0%,
        38% {
          transform: rotate(-118deg);
        }
        56% {
          transform: rotate(4deg);
        }
        62% {
          transform: rotate(-6deg);
        }
        70% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(-118deg);
        }
      }
      @keyframes m-dig {
        0%,
        38% {
          transform: scale(1, 1) translateY(-1px);
        }
        56% {
          transform: scale(1.07, 0.92);
        }
        66% {
          transform: scale(0.98, 1.03);
        }
        100% {
          transform: scale(1, 1) translateY(-1px);
        }
      }
      @keyframes m-squint {
        0%,
        50% {
          transform: scaleY(1);
        }
        56%,
        64% {
          transform: scaleY(0.35);
        }
        72%,
        100% {
          transform: scaleY(1);
        }
      }
      @keyframes m-clod {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(7px, -11px);
        }
      }
      @keyframes m-clod2 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(11px, -5px);
        }
      }
      @keyframes m-clod3 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(2px, -13px);
        }
      }
      @keyframes m-breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.05, 0.95);
        }
      }
      @keyframes m-snot {
        0%,
        8% {
          transform: scale(0.15);
          opacity: 0.9;
        }
        50% {
          transform: scale(1);
          opacity: 0.9;
        }
        88% {
          transform: scale(1.15);
          opacity: 0.9;
        }
        92% {
          transform: scale(1.35);
          opacity: 0;
        }
        100% {
          transform: scale(0.15);
          opacity: 0;
        }
      }
      @keyframes m-zz {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(9px, -14px);
        }
      }
      @keyframes m-pop {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.14);
        }
        24% {
          transform: scale(0.96);
        }
        34% {
          transform: scale(1);
        }
      }
      @keyframes m-lean {
        0%,
        100% {
          transform: rotate(0);
        }
        12% {
          transform: rotate(-5deg) translateY(-2px);
        }
        34% {
          transform: rotate(0);
        }
      }
      @keyframes m-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-28deg);
        }
      }
      /* A tablet or a phone: one column, the work first; the detail opens over it. */
      @media (max-width: 900px) {
        body {
          overflow: auto;
        }
        .app {
          height: auto;
          min-height: 100%;
        }
        .c-main,
        .c-main.closed {
          display: flex;
          flex-direction: column;
        }
        .c-items {
          order: -1;
        }
        .c-pane {
          flex: none;
          overflow: visible;
        }
        .c-scroll {
          overflow: visible;
        }
        #dock .c-scroll {
          max-height: 50vh;
          overflow: auto;
        }
        .c-p3 {
          position: fixed;
          inset: 0;
          z-index: 15;
          border: 0;
          border-radius: 0;
          padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0
            env(safe-area-inset-left, 0px);
        }
        .c-p3 .c-scroll {
          overflow: auto;
        }
        .c-gh,
        .t-work th {
          top: 0;
        }
      }
      @media (max-width: 640px) {
        :root {
          --control: 44px;
        }
        .bar {
          flex-wrap: wrap;
          padding-block: 8px;
          row-gap: 4px;
        }
        .brule {
          display: none;
        }
        h1 {
          flex: 1;
        }
        .spacer {
          display: none;
        }
        .since {
          order: 4;
          width: 100%;
          white-space: normal;
          flex-wrap: wrap;
        }
        .tools {
          display: contents;
        }
        #bPlumb {
          order: 5;
        }
        .seg button,
        .t-work th button {
          height: 44px;
        }
        .c-ph {
          height: auto;
          min-height: 52px;
          flex-wrap: wrap;
          padding: 4px 8px 4px 16px;
        }
        .c-tools {
          padding: 8px 16px;
        }
        .c-field select {
          max-width: 128px;
        }
        .c-gh,
        .c-loose {
          min-height: 44px;
        }
        .c-wb {
          grid-template-columns: 88px minmax(0, 1fr);
        }
        .c-line {
          grid-template-columns: auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            'lt lt lt lt'
            'id lm ls ago';
          gap: 2px 12px;
          padding: 8px 16px;
          min-height: 44px;
        }
        .c-line .c-id {
          grid-area: id;
        }
        .c-lt {
          grid-area: lt;
        }
        .c-lm {
          grid-area: lm;
          justify-content: flex-start;
        }
        .c-ls {
          grid-area: ls;
        }
        .c-ago {
          grid-area: ago;
        }
        .c-x {
          width: 44px;
          height: 44px;
        }
        .d-body {
          padding: 16px;
        }
        .btn.chip {
          height: 32px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--BOARD_SCRIPT-->
  </body>
