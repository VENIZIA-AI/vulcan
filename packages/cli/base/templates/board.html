<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      /* One screen: a top bar, then tabs. Luồng = flow list (left) + flow detail (right). Venizia tokens; bronze is the one data hue. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --r: 4px;
        --gap: 8px;
        --bar: 56px;
        --ease-out: cubic-bezier(.22,1,.36,1);
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --ground: #121214;
          --bg: #1b1b1b;
          --head: #202024;
          --soft: #26262b;
          --sunk: #232327;
          --line: #ffffff1a;
          --line-2: #ffffff33;
          --ink: #ffffff;
          --body: #ffffffb3;
          --muted: #ffffff8c;
          --accent: #dead6a;
          --accent-soft: #33281a;
          --accent-ink: #1a1200;
          --fail: #f97066;
          --fail-soft: #3a1d1a;
          --ok: #47cd89;
          --ok-soft: #14291f;
          --wait: #fdb022;
          --wait-soft: #33270f;
          --focus: #dead6a;
          color-scheme: dark;
          --stroke-strong: #ffffff4d;
          --t-p0: #3a3a40;
          --t-p1: #4f2c23;
          --t-p2: #4a3c1c;
          --t-p3: #4a3a25;
          --t-p4: #1f3d37;
          --t-other: #333336;
          --face-ink: #f4f4f5;
          --face-line: #ffffff4d;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 13px/1.45 var(--font);
        overflow: hidden;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 12px;
        gap: var(--gap);
      }
      .bar {
        flex: none;
        min-height: var(--bar);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark svg {
        display: block;
        width: 97.6px;
        height: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 24px;
        background: var(--stroke-strong);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .tabs {
        display: flex;
        gap: 2px;
        margin-left: 8px;
      }
      .tab {
        height: 32px;
        white-space: nowrap;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--r);
        background: none;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .tab[aria-selected='true'] {
        color: var(--ink);
        background: var(--bg);
        border-color: var(--line-2);
      }
      .tab:hover {
        color: var(--ink);
      }
      .spacer {
        flex: 1;
        min-width: 0;
      }
      .since {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--body);
        white-space: nowrap;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .fresh {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .fresh .st {
        color: var(--wait);
        font-weight: 600;
      }
      .btn {
        height: 32px;
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn.primary {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .btn.primary:hover {
        opacity: 0.88;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .btn.sq {
        width: 32px;
        padding: 0;
      }
      .btn[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--ink);
      }
      .untitled {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        margin-left: 8px;
      }
      .dh .why {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .dh .ctx p,
      .dh .nx {
        margin: 4px 0 0;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
      }
      .dh .nx b,
      .dh .lat .lb,
      .dh .ctx .lb {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .dh .lat ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .dh .lat li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
        font-size: 13px;
        line-height: 1.4;
        color: var(--ink);
      }
      .dh .lat .tm {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .nowork {
        margin: 0;
        padding: 14px 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        overflow: hidden;
        flex: none;
      }
      .seg button {
        height: 28px;
        padding: 0 10px;
        border: 0;
        background: var(--bg);
        color: var(--muted);
        font-weight: 500;
        font-size: 12.5px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .seg button + button {
        border-left: 1px solid var(--line-2);
      }
      .seg button[aria-checked='true'] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:not([aria-checked='true']):hover {
        color: var(--ink);
        background: var(--soft);
      }
      .kb {
        display: flex;
        gap: var(--gap);
        padding: 10px;
        height: 100%;
        box-sizing: border-box;
        overflow-x: auto;
        align-items: stretch;
      }
      .kc {
        flex: 0 0 200px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--head);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .kc .kh {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        color: var(--ink);
        font-size: 12.5px;
      }
      .kc .kh .n {
        color: var(--muted);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .kc .kh .hot {
        margin-left: auto;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        background: var(--wait-soft);
        color: var(--wait);
      }
      .kc .kh .hot.bad {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .kc .kl {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .kcard {
        display: grid;
        gap: 4px;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        cursor: pointer;
        text-align: left;
        transition:
          border-color 0.15s,
          transform 0.15s var(--ease-out);
      }
      .kcard:hover {
        border-color: var(--ink);
        transform: translateY(-1px);
      }
      .kcard.you {
        border-color: var(--wait);
        box-shadow: inset 3px 0 0 var(--wait);
      }
      .kcard.blocked {
        border-color: var(--fail);
        box-shadow: inset 3px 0 0 var(--fail);
      }
      .kcard[aria-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .kcard .kt {
        color: var(--ink);
        font-weight: 500;
        font-size: 12.5px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .kcard .km {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
      }
      .kcard .km .holder {
        font-size: 12px;
      }
      .kempty {
        color: var(--muted);
        font-size: 12px;
        padding: 4px 2px;
      }
      .dg {
        padding: 12px 16px 4px;
        overflow-x: auto;
      }
      .dg svg {
        display: block;
      }
      .dg .blk rect {
        fill: var(--bg);
        stroke: var(--line-2);
        stroke-width: 1;
      }
      .dg .blk.done rect {
        fill: var(--soft);
      }
      .dg .blk.cur rect {
        stroke: var(--accent);
        stroke-width: 2;
        fill: var(--accent-soft);
      }
      .dg .blk.you rect {
        stroke: var(--wait);
        stroke-width: 2.5;
        fill: var(--wait-soft);
      }
      .dg .blk.blocked rect {
        stroke: var(--fail);
        stroke-width: 2.5;
        fill: var(--fail-soft);
      }
      .dg .blk .nm {
        fill: var(--ink);
        font: 600 12.5px var(--font);
      }
      .dg .blk .who {
        fill: var(--body);
        font: 500 11.5px var(--mono);
      }
      .dg .blk .att {
        fill: var(--muted);
        font: 500 11.5px var(--font);
      }
      .dg .blk .att .x {
        fill: var(--fail);
      }
      .dg .blk .att .v {
        fill: var(--ok);
      }
      .dg .arr {
        stroke: var(--line-2);
        stroke-width: 1.5;
        fill: none;
      }
      .dg .arr.hand {
        stroke: var(--accent);
      }
      .dg .loop {
        stroke: var(--wait);
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 4 3;
      }
      .dg .lab {
        fill: var(--muted);
        font: 500 11px var(--font);
      }
      .dg .lab.hand {
        fill: var(--accent);
      }
      .dg .lab.loop {
        fill: var(--wait);
        font-weight: 600;
      }
      .dg .blk {
        cursor: default;
      }
      .dg .blk.you,
      .dg .blk.blocked {
        animation: none;
      }
      .dg .blk.you rect {
        animation: glow 1.8s ease-in-out infinite;
      }
      @keyframes glow {
        0%,
        100% {
          stroke-opacity: 1;
        }
        50% {
          stroke-opacity: 0.45;
        }
      }
      .graphp {
        flex: 1 1 68%;
      }
      .gside {
        flex: 1 1 32%;
        min-width: 280px;
      }
      .gwrap {
        position: relative;
        overflow: hidden;
      }
      .graph {
        width: 100%;
        height: 100%;
        display: block;
      }
      .graph .edge {
        fill: none;
        stroke: var(--line-2);
        stroke-linecap: round;
        cursor: pointer;
        transition:
          stroke 0.2s,
          stroke-width 0.2s;
      }
      .graph .edge:hover,
      .graph .edge.sel {
        stroke: var(--accent);
      }
      .graph .edge.active {
        stroke: var(--accent);
        stroke-dasharray: 6 6;
        animation: flow 1.1s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -12;
        }
      }
      .graph .ehit {
        fill: none;
        stroke: transparent;
        stroke-width: 16;
        cursor: pointer;
      }
      .graph .ehit:focus-visible + .edge,
      .graph .ehit:focus {
        outline: none;
      }
      .graph .ehit:focus-visible {
        stroke: var(--focus);
        stroke-opacity: 0.25;
      }
      .graph .ecount {
        fill: var(--muted);
        font: 600 11px var(--font);
        pointer-events: none;
      }
      .graph .node {
        cursor: pointer;
        transition: transform 0.45s var(--ease-out);
      }
      .graph .node .ring {
        fill: var(--bg);
        stroke: var(--line-2);
        stroke-width: 1.2;
      }
      .graph .node:hover .ring,
      .graph .node:focus-visible .ring,
      .graph .node.sel .ring {
        stroke: var(--ink);
        stroke-width: 2;
      }
      .graph .node:focus {
        outline: none;
      }
      .graph .node.working .ring {
        stroke: var(--accent);
      }
      .graph .node.you .ring {
        stroke: var(--wait);
        stroke-width: 2.5;
      }
      .graph .node.blocked .ring {
        stroke: var(--fail);
        stroke-width: 2.5;
      }
      .graph .node .gname {
        fill: var(--ink);
        font: 600 12px var(--mono);
      }
      .graph .node .gst {
        font: 600 11px var(--font);
      }
      .graph .node.working .gst {
        fill: var(--accent);
      }
      .graph .node.you .gst {
        fill: var(--wait);
      }
      .graph .node.blocked .gst {
        fill: var(--fail);
      }
      .graph .node.idle .gst {
        fill: var(--muted);
      }
      .graph .node.working .pulse {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
        transform-box: fill-box;
        transform-origin: center;
        animation: ripple 2.2s ease-out infinite;
      }
      @keyframes ripple {
        0% {
          transform: scale(1);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      .graph .node.me .ring {
        fill: var(--ink);
      }
      .graph .node.me .gname {
        fill: var(--ink);
      }
      .glegend {
        display: flex;
        gap: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .glegend i {
        display: inline-block;
        width: 18px;
        height: 0;
        border-top: 2px solid var(--line-2);
        vertical-align: middle;
        margin-right: 4px;
      }
      .glegend i.a {
        border-top: 2px dashed var(--accent);
      }
      .reas {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .reas select {
        height: 32px;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        background: var(--bg);
        color: var(--ink);
        font: 500 13px var(--font);
        padding: 0 8px;
      }
      @media (max-width: 900px) {
        .gside {
          display: none;
        }
        .kc {
          flex-basis: 170px;
        }
      }

      .btn.lang {
        min-width: 40px;
        padding: 0 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        margin: 0 4px 4px 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: none;
      }
      .view.on {
        display: flex;
        gap: var(--gap);
      }
      .pane {
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .ph {
        flex: none;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
      }
      .ph h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .ph .n {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .pb {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

        transform-origin: 0% 100%;
      }
      .cell.you .hand {
        animation: wave 1.8s ease-in-out infinite;
      }
      @keyframes wave {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-12deg);
        }
      }
      .bot .ink {
        fill: var(--face-ink);
      }
      .bot .glint {
        fill: var(--bg);
      }
      .bot .stroke {
        fill: none;
        stroke: var(--face-ink);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bot .cheek {
        fill: var(--cheek);
        opacity: 0.55;
      }
      .bot .badge {
        fill: var(--wait);
      }
      .bot .badge-ink {
        fill: var(--bg);
        font: 700 7px/1 var(--font);
      }
      .bot .z {
        fill: var(--muted);
        font: 600 7.5px/1 var(--font);
      }
      .bot .dot {
        fill: var(--face-ink);
      }
      .cell.working .body {
        animation: bob 1.8s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.5px);
        }
      }
      .cell.working .ant {
        animation: wiggle 1.4s ease-in-out infinite;
      }
      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(-12deg);
        }
        75% {
          transform: rotate(12deg);
        }
      }
      .cell.working .eyes {
        animation: blink 4.2s infinite;
      }
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      .cell.working .dot,
      .cell.working .spark {
        animation: typing 1.2s infinite;
      }
      .cell.working .spark + .spark {
        animation-delay: 0.3s;
      }
      .cell.working .dot:nth-of-type(2) {
        animation-delay: 0.15s;
      }
      .cell.working .dot:nth-of-type(3) {
        animation-delay: 0.3s;
      }
      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.25;
          transform: none;
        }
        30% {
          opacity: 1;
          transform: translateY(-1.5px);
        }
      }
      .cell.idle .body {
        animation: breathe 4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.97);
        }
      }
      .cell.idle .z {
        animation: zz 3s ease-in-out infinite;
      }
      @keyframes zz {
        0% {
          opacity: 0;
          transform: translate(0, 2px);
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(3px, -4px);
        }
      }
      .cell.you .badge-g {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }
      .cell.shake .bot {
        animation: shake 0.42s ease-in-out;
      }
      @keyframes shake {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translateX(-2px);
        }
        40% {
          transform: translateX(2px);
        }
        60% {
          transform: translateX(-1.5px);
        }
        80% {
          transform: translateX(1px);
        }
      }
      .bot .mouth-bad {
        stroke: var(--fail);
      }
      .pop {
        position: fixed;
        z-index: 30;
        width: 380px;
        max-width: calc(100vw - 32px);
        max-height: min(560px, calc(100vh - 120px));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        box-shadow: 0 12px 32px #00000033; /* taste-skill-ignore: a floating popover */
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        transform-origin: 50% 100%;
        transition:
          opacity 0.16s var(--ease-out),
          transform 0.2s var(--ease-out);
      }
      .pop.on {
        opacity: 1;
        transform: none;
      }
      .pop .phd {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 32px;
        gap: 12px;
        align-items: center;
        padding: 14px 14px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
      }
      .pop .phd .bot {
        width: 48px;
        height: 48px;
      }
      .pop .phd h2 {
        margin: 0;
        font: 600 15px/1.2 var(--mono);
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pop .phd .sub {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
      }
      .pop .pbd {
        overflow: auto;
        padding: 4px 14px 12px;
        flex: 1;
        min-height: 0;
      }
      .pop h3 {
        margin: 12px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .pop .now {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: var(--soft);
        border-radius: var(--r);
        margin-top: 10px;
        color: var(--ink);
      }
      .pop .now .tx {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pop .pevs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .pop .pevs li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
        font-size: 12.5px;
      }
      .pop .pevs .tm {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .pop .pevs .sm {
        color: var(--body);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .pop .pevs .fl {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        margin-right: 6px;
      }
      .pop .prs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .pop .prs a {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--ink);
        text-decoration: none;
        font-size: 12.5px;
        padding: 4px 0;
      }
      .pop .prs a:hover {
        color: var(--accent);
      }
      .pop .none {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0;
      }
      .pop .pft {
        border-top: 1px solid var(--line);
        padding: 12px 14px;
        display: grid;
        gap: 8px;
        background: var(--head);
      }
      .pop textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 56px;
        resize: vertical;
        padding: 8px 10px;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.4 var(--font);
      }
      .pop textarea:focus {
        outline: 2px solid var(--focus);
        outline-offset: 0;
        border-color: transparent;
      }
      .pop .row2 {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        z-index: 40;
        transform: translate(-50%, 8px);
        opacity: 0;
        pointer-events: none;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        border-radius: var(--r);
        background: var(--ink);
        color: var(--bg);
        font-weight: 500;
        font-size: 13px;
        box-shadow: 0 8px 24px #00000033; /* taste-skill-ignore: a floating toast */
        transition:
          opacity 0.18s,
          transform 0.24s var(--ease-out);
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.warn {
        background: var(--wait-soft);
        color: var(--ink);
        border: 1px solid var(--wait);
      }
      .theme {
        position: relative;
      }
      .theme svg {
        width: 18px;
        height: 18px;
        transition:
          transform 0.4s var(--ease-out),
          opacity 0.25s;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--soft);
        border: 1px solid var(--line-2);
        font-size: 12px;
        color: var(--ink);
        cursor: pointer;
      }
      .filter-chip b {
        font-family: var(--mono);
        font-weight: 500;
      }
      .sg.cur {
        position: relative;
        overflow: hidden;
      }
      .unread.pop {
        animation: pop 0.36s var(--ease-out);
      }
      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (max-width: 1599px) {
        .dock-lbl {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .cell {
          flex: 0 0 230px;
          min-width: 230px;
        }
        .dock-lbl {
          display: none;
        }
        .pop {
          left: 16px !important;
          right: 16px;
          width: auto;
          bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important;
          top: auto !important;
        }
      }
      @media (max-width: 900px) {
        .split {
          display: none;
        }
        .list {
          flex: 1 1 auto;
        }
        .detail {
          position: fixed;
          inset: 0;
          z-index: 15;
          max-width: none;
          border-radius: 0;
          border: 0;
          padding-top: env(safe-area-inset-top, 0px);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
        }
        .detail:not(.open) {
          display: none;
        }
        .detail .pb {
          flex: 1;
        }
        .back {
          display: inline-flex;
        }
        .fresh {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .bar {
          flex-wrap: wrap;
          padding-block: 8px;
          row-gap: 8px;
        }
        .brule {
          display: none;
        }
        .mark svg {
          width: 80px;
        }
        .since {
          order: 4;
          width: 100%;
          white-space: normal;
        }
        .tabs {
          order: 3;
          width: 100%;
          margin-left: 0;
        }
        .tab {
          flex: 1;
        }
        .row {
          grid-template-columns: 10px minmax(0, 1fr) 64px;
          row-gap: 4px;
        }
        .row .code {
          display: none;
        }
        .row .tt {
          grid-column: 2;
          grid-row: 1;
        }
        .row .age {
          grid-column: 3;
          grid-row: 1;
        }
        .row .strip {
          grid-column: 2/-1;
          grid-row: 2;
        }
        .row .holder {
          grid-column: 2/-1;
          grid-row: 3;
        }
        .acts {
          grid-column: 2/-1;
        }
        .tt .sub,
        .holder,
        .age,
        .ev .who,
        .ev .tm,
        .ev .src,
        .meta,
        .st .h .tm {
          font-size: 13px;
        }
        .tt .t {
          white-space: normal;
        }
        .rel {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        .rel .pane {
          min-height: 220px;
        }
        .tbl .hide-s {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .draw > .st {
          opacity: 1;
          transform: none;
        }
      }
      .mark img {
        display: block;
        height: 28px;
        width: auto;
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
    </style>
