<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      /* One screen: a top bar, the flow list (left) and the flow detail (right), and the dock of agents below. Venizia tokens; bronze is the one data hue. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --r: 4px;
        --gap: 8px;
        --bar: 56px;
        --ease-out: cubic-bezier(.22,1,.36,1);
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --ground: #121214;
          --bg: #1b1b1b;
          --head: #202024;
          --soft: #26262b;
          --sunk: #232327;
          --line: #ffffff1a;
          --line-2: #ffffff33;
          --ink: #ffffff;
          --body: #ffffffb3;
          --muted: #ffffff8c;
          --accent: #dead6a;
          --accent-soft: #33281a;
          --accent-ink: #1a1200;
          --fail: #f97066;
          --fail-soft: #3a1d1a;
          --ok: #47cd89;
          --ok-soft: #14291f;
          --wait: #fdb022;
          --wait-soft: #33270f;
          --focus: #dead6a;
          color-scheme: dark;
          --stroke-strong: #ffffff4d;
          --t-p0: #3a3a40;
          --t-p1: #4f2c23;
          --t-p2: #4a3c1c;
          --t-p3: #4a3a25;
          --t-p4: #1f3d37;
          --t-other: #333336;
          --face-ink: #f4f4f5;
          --face-line: #ffffff4d;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 13px/1.45 var(--font);
        overflow: hidden;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 12px;
        gap: var(--gap);
      }
      .bar {
        flex: none;
        min-height: var(--bar);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark svg {
        display: block;
        width: 97.6px;
        height: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 24px;
        background: var(--stroke-strong);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .tab {
        height: 32px;
        white-space: nowrap;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--r);
        background: none;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
      }
      .tab[aria-selected='true'] {
        color: var(--ink);
        background: var(--bg);
        border-color: var(--line-2);
      }
      .tab:hover {
        color: var(--ink);
      }
      .spacer {
        flex: 1;
        min-width: 0;
      }
      .since {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--body);
        white-space: nowrap;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .fresh {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .fresh .st {
        color: var(--wait);
        font-weight: 600;
      }
      .btn {
        height: 32px;
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .btn.sq {
        width: 32px;
        padding: 0;
      }
      .btn[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--ink);
      }
      .untitled {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        margin-left: 8px;
      }
      .dh .why {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .dh .ctx p,
      .dh .nx {
        margin: 4px 0 0;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
      }
      .dh .nx b,
      .dh .lat .lb,
      .dh .ctx .lb {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .dh .ckl {
        margin-top: 10px;
      }
      .dh .ckl .lb {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .dh .ckl ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }
      .dh .ckl li {
        position: relative;
        padding: 2px 0 2px 22px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
      }
      .dh .ckl li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 6px;
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--line-2);
        border-radius: 3px;
      }
      .dh .ckl li.on {
        color: var(--muted);
      }
      .dh .ckl li.on::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .dh .apps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .dh .lat ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .dh .lat li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
        font-size: 13px;
        line-height: 1.4;
        color: var(--ink);
      }
      .dh .lat .tm {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .nowork {
        margin: 0;
        padding: 14px 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        overflow: hidden;
        flex: none;
      }
      .seg button {
        height: 28px;
        padding: 0 10px;
        border: 0;
        background: var(--bg);
        color: var(--muted);
        font-weight: 500;
        font-size: 12.5px;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .seg button + button {
        border-left: 1px solid var(--line-2);
      }
      .seg button[aria-checked='true'] {
        background: var(--ink);
        color: var(--bg);
      }
      .seg button:not([aria-checked='true']):hover {
        color: var(--ink);
        background: var(--soft);
      }
      .kb {
        display: flex;
        gap: var(--gap);
        padding: 10px;
        height: 100%;
        box-sizing: border-box;
        overflow-x: auto;
        align-items: stretch;
      }
      .kc {
        flex: 0 0 200px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--head);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .kc .kh {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        color: var(--ink);
        font-size: 12.5px;
      }
      .kc .kh .n {
        color: var(--muted);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .kc .kh .hot {
        margin-left: auto;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        background: var(--wait-soft);
        color: var(--wait);
      }
      .kc .kh .hot.bad {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .kc .kl {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .kcard {
        display: grid;
        gap: 4px;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        cursor: pointer;
        text-align: left;
        transition:
          border-color 0.15s,
          transform 0.15s var(--ease-out);
      }
      .kcard:hover {
        border-color: var(--ink);
        transform: translateY(-1px);
      }
      .kcard.you {
        border-color: var(--wait);
        box-shadow: inset 3px 0 0 var(--wait);
      }
      .kcard.blocked {
        border-color: var(--fail);
        box-shadow: inset 3px 0 0 var(--fail);
      }
      .kcard[aria-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .kcard .kt {
        color: var(--ink);
        font-weight: 500;
        font-size: 12.5px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .kcard .km {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        min-width: 0;
      }
      .kcard .km .holder {
        font-size: 12px;
      }
      .kempty {
        color: var(--muted);
        font-size: 12px;
        padding: 4px 2px;
      }
      .dg {
        padding: 12px 16px 4px;
        overflow-x: auto;
      }
      .dg svg {
        display: block;
      }
      .dg .blk rect {
        fill: var(--bg);
        stroke: var(--line-2);
        stroke-width: 1;
      }
      .dg .blk.done rect {
        fill: var(--soft);
      }
      .dg .blk.cur rect {
        stroke: var(--accent);
        stroke-width: 2;
        fill: var(--accent-soft);
      }
      .dg .blk.you rect {
        stroke: var(--wait);
        stroke-width: 2.5;
        fill: var(--wait-soft);
      }
      .dg .blk.blocked rect {
        stroke: var(--fail);
        stroke-width: 2.5;
        fill: var(--fail-soft);
      }
      .dg .blk .nm {
        fill: var(--ink);
        font: 600 12.5px var(--font);
      }
      .dg .blk .who {
        fill: var(--body);
        font: 500 11.5px var(--mono);
      }
      .dg .blk .att {
        fill: var(--muted);
        font: 500 11.5px var(--font);
      }
      .dg .blk .att .x {
        fill: var(--fail);
      }
      .dg .blk .att .v {
        fill: var(--ok);
      }
      .dg .arr {
        stroke: var(--line-2);
        stroke-width: 1.5;
        fill: none;
      }
      .dg .arr.hand {
        stroke: var(--accent);
      }
      .dg .loop {
        stroke: var(--wait);
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 4 3;
      }
      .dg .lab {
        fill: var(--muted);
        font: 500 11px var(--font);
      }
      .dg .lab.hand {
        fill: var(--accent);
      }
      .dg .lab.loop {
        fill: var(--wait);
        font-weight: 600;
      }
      .dg .blk {
        cursor: default;
      }
      .dg .blk.you,
      .dg .blk.blocked {
        animation: none;
      }
      .dg .blk.you rect {
        animation: glow 1.8s ease-in-out infinite;
      }
      @keyframes glow {
        0%,
        100% {
          stroke-opacity: 1;
        }
        50% {
          stroke-opacity: 0.45;
        }
      }
      @media (max-width: 900px) {
        .kc {
          flex-basis: 170px;
        }
      }

      .btn.lang {
        min-width: 40px;
        padding: 0 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        margin: 0 4px 4px 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: none;
      }
      .view.on {
        display: flex;
        gap: var(--gap);
      }
      .pane {
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .ph {
        flex: none;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
      }
      .ph h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .ph .n {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .pb {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .list {
        flex: 0 0 calc(var(--split, 58%) - 4px);
        min-width: 280px;
      }
      .detail {
        flex: 1 1 0;
        min-width: 300px;
      }
      .view.on#vFlows {
        gap: 0;
      }
      .split {
        flex: none;
        width: 8px;
        cursor: col-resize;
        position: relative;
        touch-action: none;
      }
      .split::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 50%;
        width: 2px;
        height: 40px;
        margin-top: -20px;
        border-radius: 1px;
        background: var(--line-2);
        transition:
          background-color 0.15s,
          height 0.2s var(--ease-out);
      }
      .split:hover::after,
      .split.drag::after,
      .split:focus-visible::after {
        background: var(--accent);
        height: 64px;
        margin-top: -32px;
      }
      .grp {
        border-bottom: 1px solid var(--line);
      }
      .grp:last-child {
        border-bottom: 0;
      }
      .gh {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 36px;
        padding: 0 14px;
        background: var(--head);
        border: 0;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        text-align: left;
        color: var(--ink);
        font-weight: 600;
        font-size: 13px;
      }
      .gh .n {
        color: var(--muted);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      .gh .chev {
        width: 12px;
        height: 12px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }
      .gh .sw {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .row {
        display: grid;
        grid-template-columns: 10px 44px minmax(0, 1fr) 112px 76px;
        align-items: center;
        column-gap: 10px;
        row-gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        position: relative;
      }
      .row > :first-child {
        grid-column: 1;
        grid-row: 1;
      }
      .row > .code {
        grid-column: 2;
        grid-row: 1;
      }
      .row > .tt {
        grid-column: 3;
        grid-row: 1;
      }
      .row > .holder {
        grid-column: 4;
        grid-row: 1;
      }
      .row > .age {
        grid-column: 5;
        grid-row: 1;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--sunk);
      }
      .row[aria-selected='true'] {
        background: var(--accent-soft);
      }
      .row.flash {
        animation: flash 1.4s ease-out;
      }
      @keyframes flash {
        0% {
          background: var(--accent-soft);
        }
        100% {
          background: transparent;
        }
      }
      .unread {
        width: 8px;

        min-height: 0;
      }
      .pop h3 {
        margin: 12px 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .pop .now {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: var(--soft);
        border-radius: var(--r);
        margin-top: 10px;
        color: var(--ink);
      }
      .pop .now .tx {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pop .pevs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .pop .pevs li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
        font-size: 12.5px;
      }
      .pop .pevs .tm {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .pop .pevs .sm {
        color: var(--body);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .pop .pevs .fl {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        margin-right: 6px;
      }
      .pop .prs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .pop .prs a {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--ink);
        text-decoration: none;
        font-size: 12.5px;
        padding: 4px 0;
      }
      .pop .prs a:hover {
        color: var(--accent);
      }
      .pop .none {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0;
      }
      .pop .pft {
        border-top: 1px solid var(--line);
        padding: 12px 14px;
        display: grid;
        gap: 8px;
        background: var(--head);
      }
      .pop textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 56px;
        resize: vertical;
        padding: 8px 10px;
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.4 var(--font);
      }
      .pop textarea:focus {
        outline: 2px solid var(--focus);
        outline-offset: 0;
        border-color: transparent;
      }
      .pop .row2 {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .theme {
        position: relative;
      }
      .theme svg {
        width: 18px;
        height: 18px;
        transition:
          transform 0.4s var(--ease-out),
          opacity 0.25s;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--soft);
        border: 1px solid var(--line-2);
        font-size: 12px;
        color: var(--ink);
        cursor: pointer;
      }
      .filter-chip b {
        font-family: var(--mono);
        font-weight: 500;
      }
      .sg.cur {
        position: relative;
        overflow: hidden;
      }
      .unread.pop {
        animation: pop 0.36s var(--ease-out);
      }
      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (max-width: 1599px) {
        .dock-lbl {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .cell {
          flex: 0 0 230px;
          min-width: 230px;
        }
        .dock-lbl {
          display: none;
        }
        .pop {
          left: 16px !important;
          right: 16px;
          width: auto;
          bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important;
          top: auto !important;
        }
      }
      @media (max-width: 900px) {
        .split {
          display: none;
        }
        .list {
          flex: 1 1 auto;
        }
        .detail {
          position: fixed;
          inset: 0;
          z-index: 15;
          max-width: none;
          border-radius: 0;
          border: 0;
          padding-top: env(safe-area-inset-top, 0px);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
        }
        .detail:not(.open) {
          display: none;
        }
        .detail .pb {
          flex: 1;
        }
        .back {
          display: inline-flex;
        }
        .fresh {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .bar {
          flex-wrap: wrap;
          padding-block: 8px;
          row-gap: 8px;
        }
        .brule {
          display: none;
        }
        .mark svg {
          width: 80px;
        }
        .since {
          order: 4;
          width: 100%;
          white-space: normal;
        }
        .tab {
          flex: 1;
        }
        .row {
          grid-template-columns: 10px minmax(0, 1fr) 64px;
          row-gap: 4px;
        }
        .row .code {
          display: none;
        }
        .row .tt {
          grid-column: 2;
          grid-row: 1;
        }
        .row .age {
          grid-column: 3;
          grid-row: 1;
        }
        .row .strip {
          grid-column: 2/-1;
          grid-row: 2;
        }
        .row .holder {
          grid-column: 2/-1;
          grid-row: 3;
        }
        .tt .sub,
        .holder,
        .age,
        .ev .who,
        .ev .tm,
        .ev .src,
        .meta,
        .st .h .tm {
          font-size: 13px;
        }
        .tt .t {
          white-space: normal;
        }
        .rel {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        .rel .pane {
          min-height: 220px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .draw > .st {
          opacity: 1;
          transform: none;
        }
      }
      .mark img {
        display: block;
        height: 28px;
        width: auto;
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
    </style>
  </head>
