<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      /* One screen: a top bar, the flow list (left) and the flow detail (right), and the dock of agents below. Venizia tokens; bronze is the one data hue. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --r: 4px;
        --gap: 8px;
        --bar: 56px;
        --ease-out: cubic-bezier(.22,1,.36,1);
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --ground: #121214;
          --bg: #1b1b1b;
          --head: #202024;
          --soft: #26262b;
          --sunk: #232327;
          --line: #ffffff1a;
          --line-2: #ffffff33;
          --ink: #ffffff;
          --body: #ffffffb3;
          --muted: #ffffff8c;
          --accent: #dead6a;
          --accent-soft: #33281a;
          --accent-ink: #1a1200;
          --fail: #f97066;
          --fail-soft: #3a1d1a;
          --ok: #47cd89;
          --ok-soft: #14291f;
          --wait: #fdb022;
          --wait-soft: #33270f;
          --focus: #dead6a;
          color-scheme: dark;
          --stroke-strong: #ffffff4d;
          --face-ink: #f4f4f5;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --face-ink: #f4f4f5;
        --cheek: #b8706a;
      }
      :root[data-board-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --face-ink: #f4f4f5;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 13px/1.45 var(--font);
        overflow: hidden;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 12px;
        gap: var(--gap);
      }
      .bar {
        flex: none;
        min-height: var(--bar);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark svg {
        display: block;
        width: 97.6px;
        height: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 24px;
        background: var(--stroke-strong);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .spacer {
        flex: 1;
        min-width: 0;
      }
      .since {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--body);
        white-space: nowrap;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .fresh {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .fresh .st {
        color: var(--wait);
        font-weight: 600;
      }
      .btn {
        height: 32px;
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .btn.sq {
        width: 32px;
        padding: 0;
      }
      .btn[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--ink);
      }
      .untitled {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        margin-left: 8px;
      }

      .btn.lang {
        min-width: 40px;
        padding: 0 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        margin: 0 4px 4px 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: none;
      }
      .view.on {
        display: flex;
        gap: var(--gap);
      }
      .detail {
        flex: 1 1 0;
        min-width: 300px;
      }
      .view.on#vFlows {
        gap: 0;
      }
      .unread {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .repo {
        font-size: 13px;
        font-weight: 600;
        color: var(--body);
        flex: none;
      }
      .mk {
        width: 10px;
        height: 10px;
        flex: none;
      }
      .mk.x {
        color: var(--fail);
      }
      .mk.v {
        color: var(--ok);
      }
      .ask {
        padding: 10px 12px;
        background: var(--soft);
        border-radius: var(--r);
        color: var(--ink);
      }
      .st {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        column-gap: 10px;
        padding: 8px 0;
        position: relative;
      }
      .st::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 28px;
        bottom: -8px;
        width: 1px;
        background: var(--line-2);
      }
      .st:last-child::before {
        display: none;
      }
      .st .k {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid var(--line-2);
        background: var(--bg);
        margin-top: 2px;
        box-sizing: border-box;
      }
      .st.done .k {
        background: var(--body);
        border-color: var(--body);
      }
      .st.cur .k {
        background: var(--accent);
        border-color: var(--accent);
      }
      .st.fail .k {
        border-color: var(--fail);
        background: var(--fail-soft);
      }
      .st .h {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .st .h .tm {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .evs {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .ev {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        column-gap: 10px;
        font-size: 13px;
      }
      .ev .tm {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }
      .ev .who {
        font-size: 13px;
        color: var(--muted);
      }
      .ev .who b {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .ev .who b {
        color: var(--ink);
        font-weight: 500;
      }
      .ev .sm {
        color: var(--body);
      }
      .ev.fail .sm {
        color: var(--fail);
      }
      .ev .lk {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
        word-break: break-all;
      }
      .ev .lk:hover {
        text-decoration: underline;
      }
      .ev .src {
        font-size: 12px;
        color: var(--muted);
      }
      .keys {
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 0px));
        top: calc(var(--bar) + 12px + env(safe-area-inset-top, 0px));
        z-index: 20;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        box-shadow: 0 8px 24px #00000026; /* taste-skill-ignore: a floating dialog */
        padding: 12px 14px;
        width: 260px;
      }
      .keys h2 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--ink);
      }
      .keys dl {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 6px 10px;
        margin: 0;
      }
      .keys dt {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
      }
      .keys dd {
        margin: 0;
      }
      .dock {
        flex: none;
        display: flex;
        gap: var(--gap);
        min-width: 0;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        padding-top: 2px;
      }
      /* The mascots: solid colour, thick outline, round hands. Motion is cheap keyframes and stops for reduced motion. */
      .bot {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .m-o {
        stroke: var(--face-ink);
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .m-line {
        fill: none;
      }
      .m-ink {
        fill: var(--face-ink);
      }
      .m-bad {
        stroke: var(--fail);
      }
      .m-shadow {
        opacity: 0.12;
      }
      .m-q {
        font: 900 13px system-ui;
        fill: #1f1f1f;
      }
      .m-hoe {
        transform-origin: 26px 22px;
        animation: m-swing 1.1s cubic-bezier(0.55, 0, 0.35, 1) infinite;
      }
      .m-dig {
        transform-origin: 20px 36px;
        animation: m-dig 1.1s ease-in-out infinite;
      }
      .m-squint {
        transform-origin: 20px 23px;
        animation: m-squint 1.1s ease-in-out infinite;
      }
      .m-clod {
        opacity: 0;
        animation: m-clod 1.1s ease-out infinite;
      }
      .m-c2 {
        animation-name: m-clod2;
      }
      .m-c3 {
        animation-name: m-clod3;
      }
      .m-sleep {
        transform-origin: 20px 36px;
        animation: m-breathe 3s ease-in-out infinite;
      }
      .m-snot {
        transform-origin: 24.5px 29px;
        animation: m-snot 3s ease-in-out infinite;
      }
      .m-zz {
        font: 900 9px system-ui;
        fill: #3b4cca;
        opacity: 0;
        animation: m-zz 3s ease-in-out infinite;
      }
      .m-z2 {
        font-size: 11px;
        animation-delay: 1s;
      }
      .m-z3 {
        font-size: 13px;
        animation-delay: 2s;
      }
      .m-bubble {
        transform-origin: 35px 6px;
        animation: m-pop 1.8s ease-in-out infinite;
      }
      .m-lean {
        transform-origin: 20px 36px;
        animation: m-lean 1.8s ease-in-out infinite;
      }
      .m-wave {
        transform-origin: 33px 26px;
        animation: m-wave 0.9s ease-in-out infinite;
      }
      @keyframes m-swing {
        0%,
        38% {
          transform: rotate(-118deg);
        }
        56% {
          transform: rotate(4deg);
        }
        62% {
          transform: rotate(-6deg);
        }
        70% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(-118deg);
        }
      }
      @keyframes m-dig {
        0%,
        38% {
          transform: scale(1, 1) translateY(-1px);
        }
        56% {
          transform: scale(1.07, 0.92);
        }
        66% {
          transform: scale(0.98, 1.03);
        }
        100% {
          transform: scale(1, 1) translateY(-1px);
        }
      }
      @keyframes m-squint {
        0%,
        50% {
          transform: scaleY(1);
        }
        56%,
        64% {
          transform: scaleY(0.35);
        }
        72%,
        100% {
          transform: scaleY(1);
        }
      }
      @keyframes m-clod {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(7px, -11px);
        }
      }
      @keyframes m-clod2 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(11px, -5px);
        }
      }
      @keyframes m-clod3 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(2px, -13px);
        }
      }
      @keyframes m-breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.05, 0.95);
        }
      }
      @keyframes m-snot {
        0%,
        8% {
          transform: scale(0.15);
          opacity: 0.9;
        }
        50% {
          transform: scale(1);
          opacity: 0.9;
        }
        88% {
          transform: scale(1.15);
          opacity: 0.9;
        }
        92% {
          transform: scale(1.35);
          opacity: 0;
        }
        100% {
          transform: scale(0.15);
          opacity: 0;
        }
      }
      @keyframes m-zz {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(9px, -14px);
        }
      }
      @keyframes m-pop {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.14);
        }
        24% {
          transform: scale(0.96);
        }
        34% {
          transform: scale(1);
        }
      }
      @keyframes m-lean {
        0%,
        100% {
          transform: rotate(0);
        }
        12% {
          transform: rotate(-5deg) translateY(-2px);
        }
        34% {
          transform: rotate(0);
        }
      }
      @keyframes m-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-28deg);
        }
      }
      .theme {
        position: relative;
      }
      .theme svg {
        width: 18px;
        height: 18px;
        transition:
          transform 0.4s var(--ease-out),
          opacity 0.25s;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--soft);
        border: 1px solid var(--line-2);
        font-size: 12px;
        color: var(--ink);
        cursor: pointer;
      }
      .filter-chip b {
        font-family: var(--mono);
        font-weight: 500;
      }
      @media (max-width: 900px) {
        .detail {
          position: fixed;
          inset: 0;
          z-index: 15;
          max-width: none;
          border-radius: 0;
          border: 0;
          padding-top: env(safe-area-inset-top, 0px);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
        }
        .detail:not(.open) {
          display: none;
        }
        .fresh {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .bar {
          flex-wrap: wrap;
          padding-block: 8px;
          row-gap: 8px;
        }
        .brule {
          display: none;
        }
        .mark svg {
          width: 80px;
        }
        .since {
          order: 4;
          width: 100%;
          white-space: normal;
        }
        .ev .who,
        .ev .tm,
        .ev .src,
        .st .h .tm {
          font-size: 13px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .mark img {
        display: block;
        height: 28px;
        width: auto;
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
      /* Three panes: the agents, the work, and the detail of what was picked. */
      .c-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 470px;
        gap: 12px;
      }
      .c-main.closed {
        grid-template-columns: 330px minmax(0, 1fr);
      }
      .c-pane {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .c-pane[hidden] {
        display: none;
      }
      .c-ph {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        flex: none;
      }
      .c-n {
        color: var(--muted);
        font-weight: 500;
      }
      .c-x {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        cursor: pointer;
      }
      .c-x:hover {
        background: var(--soft);
      }
      .c-scroll {
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .c-p3 .c-scroll {
        display: block;
      }
      .c-tg {
        margin-left: auto;
        height: 28px;
        font-size: 12px;
      }
      .c-loose {
        display: block;
        width: 100%;
        padding: 12px 14px;
        text-align: left;
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .c-loose:hover {
        background: var(--sunk);
      }
      .c-loose[aria-pressed='true'] {
        color: var(--ink);
        background: var(--accent-soft);
      }
      .c-empty {
        margin: 0;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .c-card {
        padding: 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .c-card:hover {
        background: var(--sunk);
      }
      .c-card.sel {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .c-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
      }
      .c-compact {
        display: flex;
        align-items: center;
        gap: 4px 10px;
        padding: 8px 14px;
      }
      .c-compact .c-id {
        white-space: nowrap;
      }
      .c-compact .c-face {
        width: 52px;
        height: 46px;
      }
      .c-ask {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--fail);
      }
      .c-grow {
        flex: 1;
        min-width: 0;
      }
      .c-face {
        width: 72px;
        height: 64px;
        flex: none;
      }
      .c-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
      }
      .c-nm {
        font: 700 13.5px var(--mono);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-top .c-badge {
        flex: none;
      }
      .c-role {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-badge {
        font-size: 11px;
        font-weight: 700;
        border-radius: var(--r);
        padding: 1px 7px;
        white-space: nowrap;
      }
      .b-ask {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .b-work {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .b-idle {
        background: var(--soft);
        color: var(--muted);
      }
      .b-wait {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .b-ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .c-body {
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }
      .c-k {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-top: 6px;
      }
      .c-v {
        color: var(--ink);
        min-width: 0;
      }
      .c-v small {
        color: var(--muted);
      }
      .c-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .c-foot b {
        color: var(--ink);
      }
      .c-r {
        margin-left: auto;
      }
      .c-id {
        font: 11.5px var(--mono);
        color: var(--muted);
      }
      .c-ref {
        color: var(--accent);
        font-weight: 600;
        font-size: 12px;
      }
      .c-title {
        font-weight: 700;
        font-size: 15px;
        margin-top: 8px;
        color: var(--ink);
      }
      .c-now {
        margin-top: 2px;
        color: var(--body);
      }
      .c-wb {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 7px 12px;
        font-size: 12.5px;
      }
      .c-wb .c-k {
        margin-top: 0;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        font-size: 12.5px;
      }
      .c-mini {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .c-bar {
        flex: 0 0 120px;
        height: 5px;
        background: var(--soft);
        border-radius: 3px;
      }
      .c-bar span {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--ok);
      }
      .c-pr {
        font: 12px var(--mono);
        margin-right: 8px;
      }
      .c-pr .good {
        color: var(--ok);
      }
      .c-pr .bad {
        color: var(--fail);
      }
      .c-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .c-chips span {
        font: 12px var(--mono);
        background: var(--soft);
        border-radius: var(--r);
        padding: 0 6px;
        color: var(--ink);
      }
      .c-chips span.h {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }
      .c-gh {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 12px 14px 8px;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 700 12px var(--font);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
      }
      .c-gh .chev {
        width: 12px;
        height: 12px;
        transition: transform 0.15s;
      }
      .c-gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }
      .c-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .d-body {
        padding: 16px 18px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--body);
      }
      .d-body h2 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .d-meta {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .d-who {
        font-family: var(--mono);
        color: var(--body);
      }
      .d-stages {
        display: flex;
        gap: 4px;
        margin: 14px 0 4px;
      }
      .d-stages .st {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--soft);
      }
      .d-stages .st.done {
        background: var(--ok);
      }
      .d-stages .st.cur {
        background: var(--wait);
      }
      .d-stl {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .d-stl b {
        color: var(--wait);
      }
      .d-sec {
        margin-top: 18px;
      }
      .d-sec h4 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .d-sec p {
        margin: 0;
        color: var(--ink);
      }
      .d-sec .c-chips {
        margin-top: 8px;
      }
      .d-prog {
        height: 4px;
        background: var(--soft);
        border-radius: 2px;
        margin: 0 0 6px;
      }
      .d-prog span {
        display: block;
        height: 100%;
        background: var(--ok);
        border-radius: 2px;
      }
      .d-sec .ckl ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .d-sec .ckl li {
        position: relative;
        padding: 4px 0 4px 26px;
        color: var(--ink);
        border-bottom: 1px dashed var(--line);
      }
      .d-sec .ckl li:last-child {
        border-bottom: 0;
      }
      .d-sec .ckl li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 7px;
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--line-2);
        border-radius: 3px;
      }
      .d-sec .ckl li.on {
        color: var(--body);
      }
      .d-sec .ckl li.on::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .d-sec .ckl li.on::after {
        content: '✓';
        position: absolute;
        left: 4px;
        top: 3px;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
      }
      .d-waiting {
        display: flex;
        gap: 10px;
        background: var(--wait-soft);
        border-left: 3px solid var(--wait);
        padding: 10px 12px;
        border-radius: var(--r);
        color: var(--ink);
      }
      .d-k {
        font-weight: 700;
        color: var(--wait);
        white-space: nowrap;
      }
      .d-up {
        border-left: 2px solid var(--line-2);
        margin-left: 5px;
        padding-left: 16px;
      }
      .d-u {
        margin-bottom: 12px;
        position: relative;
        color: var(--ink);
      }
      .d-u::before {
        content: '';
        position: absolute;
        left: -22px;
        top: 7px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line-2);
      }
      .d-u.last::before {
        background: var(--wait);
      }
      .d-u time,
      .d-list time {
        font: 12px var(--mono);
        color: var(--muted);
        margin-right: 8px;
      }
      .d-tag {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: var(--r);
        padding: 0 6px;
        margin-right: 6px;
      }
      .d-all {
        margin-top: 12px;
      }
      .d-empty {
        margin: 0;
        color: var(--muted);
      }
      .d-agenthead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .d-agenthead .bot {
        width: 75px;
        height: 66px;
        flex: none;
      }
      .d-list {
        margin: 0;
        padding: 0;
        list-style: none;
        color: var(--ink);
      }
      .d-list li {
        padding: 3px 0;
      }
      @media (max-width: 900px) {
        .c-main,
        .c-main.closed {
          display: flex;
          flex-direction: column;
          overflow: auto;
        }
        .c-main > .c-pane:first-child {
          flex: none;
        }
        .c-main > .c-pane:first-child .c-scroll {
          max-height: 40vh;
        }
        .c-main > .c-pane:nth-child(2) {
          flex: 1 0 auto;
        }
        .c-p3 {
          position: fixed;
          inset: var(--bar) 0 0 0;
          z-index: 5;
        }
      }
    </style>
  </head>
