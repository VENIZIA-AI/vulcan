<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      /* One screen: a top bar, the flow list (left) and the flow detail (right), and the dock of agents below. Venizia tokens; bronze is the one data hue. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --r: 4px;
        --gap: 8px;
        --bar: 56px;
        --ease-out: cubic-bezier(.22,1,.36,1);
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --ground: #121214;
          --bg: #1b1b1b;
          --head: #202024;
          --soft: #26262b;
          --sunk: #232327;
          --line: #ffffff1a;
          --line-2: #ffffff33;
          --ink: #ffffff;
          --body: #ffffffb3;
          --muted: #ffffff8c;
          --accent: #dead6a;
          --accent-soft: #33281a;
          --accent-ink: #1a1200;
          --fail: #f97066;
          --fail-soft: #3a1d1a;
          --ok: #47cd89;
          --ok-soft: #14291f;
          --wait: #fdb022;
          --wait-soft: #33270f;
          --focus: #dead6a;
          color-scheme: dark;
          --stroke-strong: #ffffff4d;
          --t-p0: #3a3a40;
          --t-p1: #4f2c23;
          --t-p2: #4a3c1c;
          --t-p3: #4a3a25;
          --t-p4: #1f3d37;
          --t-other: #333336;
          --face-ink: #f4f4f5;
          --face-line: #ffffff4d;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='dark'] {
        --ground: #121214;
        --bg: #1b1b1b;
        --head: #202024;
        --soft: #26262b;
        --sunk: #232327;
        --line: #ffffff1a;
        --line-2: #ffffff33;
        --ink: #ffffff;
        --body: #ffffffb3;
        --muted: #ffffff8c;
        --accent: #dead6a;
        --accent-soft: #33281a;
        --accent-ink: #1a1200;
        --fail: #f97066;
        --fail-soft: #3a1d1a;
        --ok: #47cd89;
        --ok-soft: #14291f;
        --wait: #fdb022;
        --wait-soft: #33270f;
        --focus: #dead6a;
        color-scheme: dark;
        --stroke-strong: #ffffff4d;
        --t-p0: #3a3a40;
        --t-p1: #4f2c23;
        --t-p2: #4a3c1c;
        --t-p3: #4a3a25;
        --t-p4: #1f3d37;
        --t-other: #333336;
        --face-ink: #f4f4f5;
        --face-line: #ffffff4d;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --ground: #f5f5f5;
        --bg: #ffffff;
        --head: #fafafa;
        --soft: #f2f2f2;
        --sunk: #f7f7f7;
        --line: #0000001a;
        --line-2: #00000033;
        --ink: #000000;
        --body: #4b4b4b;
        --muted: #6b6b6b;
        --accent: #8a5a20;
        --accent-soft: #f5ecdf;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --fail-soft: #fdecea;
        --ok: #067647;
        --ok-soft: #e7f5ee;
        --wait: #8a4b00;
        --wait-soft: #fdf1dc;
        --focus: #8a5a20;
        color-scheme: light;
        --stroke-strong: #101010;
        --t-p0: #ececef;
        --t-p1: #fbe1d8;
        --t-p2: #f7e9c6;
        --t-p3: #f1e3cf;
        --t-p4: #d9efe9;
        --t-other: #ededed;
        --face-ink: #18181b;
        --face-line: #00000040;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 13px/1.45 var(--font);
        overflow: hidden;
        transition:
          background-color 0.2s,
          color 0.2s;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 12px;
        gap: var(--gap);
      }
      .bar {
        flex: none;
        min-height: var(--bar);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark svg {
        display: block;
        width: 97.6px;
        height: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 24px;
        background: var(--stroke-strong);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .spacer {
        flex: 1;
        min-width: 0;
      }
      .since {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--body);
        white-space: nowrap;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .fresh {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .fresh .st {
        color: var(--wait);
        font-weight: 600;
      }
      .btn {
        height: 32px;
        box-sizing: border-box;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .btn.sq {
        width: 32px;
        padding: 0;
      }
      .btn[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--ink);
      }
      .untitled {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        margin-left: 8px;
      }

      .btn.lang {
        min-width: 40px;
        padding: 0 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        margin: 0 4px 4px 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: none;
      }
      .view.on {
        display: flex;
        gap: var(--gap);
      }
      .detail {
        flex: 1 1 0;
        min-width: 300px;
      }
      .view.on#vFlows {
        gap: 0;
      }
      .unread {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .repo {
        font-size: 13px;
        font-weight: 600;
        color: var(--body);
        flex: none;
      }
      .mk {
        width: 10px;
        height: 10px;
        flex: none;
      }
      .mk.x {
        color: var(--fail);
      }
      .mk.v {
        color: var(--ok);
      }
      .ask {
        padding: 10px 12px;
        background: var(--soft);
        border-radius: var(--r);
        color: var(--ink);
      }
      .st {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        column-gap: 10px;
        padding: 8px 0;
        position: relative;
      }
      .st::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 28px;
        bottom: -8px;
        width: 1px;
        background: var(--line-2);
      }
      .st:last-child::before {
        display: none;
      }
      .st .k {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid var(--line-2);
        background: var(--bg);
        margin-top: 2px;
        box-sizing: border-box;
      }
      .st.done .k {
        background: var(--body);
        border-color: var(--body);
      }
      .st.cur .k {
        background: var(--accent);
        border-color: var(--accent);
      }
      .st.fail .k {
        border-color: var(--fail);
        background: var(--fail-soft);
      }
      .st .h {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .st .h .tm {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .evs {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .ev {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        column-gap: 10px;
        font-size: 13px;
      }
      .ev .tm {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }
      .ev .who {
        font-size: 13px;
        color: var(--muted);
      }
      .ev .who b {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .ev .who b {
        color: var(--ink);
        font-weight: 500;
      }
      .ev .sm {
        color: var(--body);
      }
      .ev.fail .sm {
        color: var(--fail);
      }
      .ev .lk {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
        word-break: break-all;
      }
      .ev .lk:hover {
        text-decoration: underline;
      }
      .ev .src {
        font-size: 12px;
        color: var(--muted);
      }
      @keyframes draw {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .keys {
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 0px));
        top: calc(var(--bar) + 12px + env(safe-area-inset-top, 0px));
        z-index: 20;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        box-shadow: 0 8px 24px #00000026; /* taste-skill-ignore: a floating dialog */
        padding: 12px 14px;
        width: 260px;
      }
      .keys h2 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--ink);
      }
      .keys dl {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 6px 10px;
        margin: 0;
      }
      .keys dt {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
      }
      .keys dd {
        margin: 0;
      }
      .dock {
        flex: none;
        display: flex;
        gap: var(--gap);
        min-width: 0;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        padding-top: 2px;
      }
      .bot {
        width: 40px;
        height: 40px;
        display: block;
        overflow: visible;
      }
      .bot .body,
      .bot .ant {
        transform-box: fill-box;
      }
      .bot .body {
        transform-origin: 50% 100%;
      }
      .bot .ant {
        transform-origin: 50% 100%;
      }
      .bot .eyes {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .bot .shell {
        stroke: var(--face-ink);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .bot .shade {
        fill: var(--face-ink);
        opacity: 0.09;
      }
      .bot .acc,
      .bot .spark {
        fill: var(--accent);
      }
      .bot .acc-stroke {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bot .core {
        fill: var(--bg);
        opacity: 0.6;
      }
      .bot .speck {
        fill: var(--accent);
        opacity: 0.75;
      }
      .bot .facet {
        fill: none;
        stroke: var(--face-ink);
        stroke-width: 1;
        opacity: 0.35;
        stroke-linecap: round;
      }
      .bot .stem {
        fill: none;
        stroke: var(--face-ink);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .bot .tip {
        fill: var(--face-ink);
      }
      .bot .band {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .bot .brow {
        stroke-width: 1.3;
      }
      .bot .sweat {
        fill: var(--bg);
        stroke: var(--face-ink);
        stroke-width: 1;
      }
      .bot .mark {
        fill: var(--fail);
      }
      .bot .mark-ink {
        stroke: #fff;
        stroke-width: 1.4;
        stroke-linecap: round;
      }
      .bot .mark-dot {
        fill: #fff;
      }
      .bot .z2 {
        font-size: 5.5px;
      }
      .bot .hand {
        transform-box: fill-box;
        transform-origin: 0% 100%;
      }
      .c-card.you .hand {
        animation: wave 1.8s ease-in-out infinite;
      }
      @keyframes wave {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-12deg);
        }
      }
      .bot .ink {
        fill: var(--face-ink);
      }
      .bot .glint {
        fill: var(--bg);
      }
      .bot .stroke {
        fill: none;
        stroke: var(--face-ink);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bot .cheek {
        fill: var(--cheek);
        opacity: 0.55;
      }
      .bot .badge {
        fill: var(--wait);
      }
      .bot .badge-ink {
        fill: var(--bg);
        font: 700 7px/1 var(--font);
      }
      .bot .z {
        fill: var(--muted);
        font: 600 7.5px/1 var(--font);
      }
      .c-card.working .body {
        animation: bob 1.8s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.5px);
        }
      }
      .c-card.working .ant {
        animation: wiggle 1.4s ease-in-out infinite;
      }
      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(-12deg);
        }
        75% {
          transform: rotate(12deg);
        }
      }
      .c-card.working .eyes {
        animation: blink 4.2s infinite;
      }
      @keyframes blink {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      .c-card.working .spark {
        animation: typing 1.2s infinite;
      }
      .c-card.working .spark + .spark {
        animation-delay: 0.3s;
      }
      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.25;
          transform: none;
        }
        30% {
          opacity: 1;
          transform: translateY(-1.5px);
        }
      }
      .c-card.idle .body {
        animation: breathe 4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.97);
        }
      }
      .c-card.idle .z {
        animation: zz 3s ease-in-out infinite;
      }
      @keyframes zz {
        0% {
          opacity: 0;
          transform: translate(0, 2px);
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(3px, -4px);
        }
      }
      .c-card.you .badge-g {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }
      .bot .mouth-bad {
        stroke: var(--fail);
      }
      .theme {
        position: relative;
      }
      .theme svg {
        width: 18px;
        height: 18px;
        transition:
          transform 0.4s var(--ease-out),
          opacity 0.25s;
      }
      .filter-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border-radius: 3px;
        background: var(--soft);
        border: 1px solid var(--line-2);
        font-size: 12px;
        color: var(--ink);
        cursor: pointer;
      }
      .filter-chip b {
        font-family: var(--mono);
        font-weight: 500;
      }
      @media (max-width: 900px) {
        .detail {
          position: fixed;
          inset: 0;
          z-index: 15;
          max-width: none;
          border-radius: 0;
          border: 0;
          padding-top: env(safe-area-inset-top, 0px);
          padding-left: env(safe-area-inset-left, 0px);
          padding-right: env(safe-area-inset-right, 0px);
        }
        .detail:not(.open) {
          display: none;
        }
        .fresh {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .bar {
          flex-wrap: wrap;
          padding-block: 8px;
          row-gap: 8px;
        }
        .brule {
          display: none;
        }
        .mark svg {
          width: 80px;
        }
        .since {
          order: 4;
          width: 100%;
          white-space: normal;
        }
        .ev .who,
        .ev .tm,
        .ev .src,
        .st .h .tm {
          font-size: 13px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .mark img {
        display: block;
        height: 28px;
        width: auto;
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
      /* Three panes: the agents, the work, and the detail of what was picked. */
      .c-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 470px;
        gap: 12px;
      }
      .c-main.closed {
        grid-template-columns: 330px minmax(0, 1fr);
      }
      .c-pane {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .c-pane[hidden] {
        display: none;
      }
      .c-ph {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
        font-weight: 700;
        flex: none;
      }
      .c-n {
        color: var(--muted);
        font-weight: 500;
      }
      .c-x {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: var(--r);
        border: 1px solid var(--line-2);
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        cursor: pointer;
      }
      .c-x:hover {
        background: var(--soft);
      }
      .c-scroll {
        overflow: auto;
        flex: 1;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--sunk);
      }
      .c-p3 .c-scroll {
        padding: 0;
        display: block;
        background: var(--bg);
      }
      .c-empty {
        margin: 0;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }
      .c-card {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        cursor: pointer;
      }
      .c-card:hover {
        border-color: var(--line-2);
      }
      .c-card.sel {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .c-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--head);
        border-radius: var(--r) var(--r) 0 0;
      }
      .c-grow {
        flex: 1;
        min-width: 0;
      }
      .c-face {
        width: 38px;
        height: 38px;
        flex: none;
      }
      .c-face .bot {
        width: 38px;
        height: 38px;
      }
      .c-nm {
        font: 700 13.5px var(--mono);
      }
      .c-role {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-badge {
        font-size: 11px;
        font-weight: 700;
        border-radius: var(--r);
        padding: 1px 7px;
        white-space: nowrap;
      }
      .b-ask {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .b-work {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .b-idle {
        background: var(--soft);
        color: var(--muted);
      }
      .b-wait {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .b-ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .c-body {
        padding: 8px 12px 10px;
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }
      .c-k {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-top: 6px;
      }
      .c-v {
        color: var(--ink);
        min-width: 0;
      }
      .c-v small {
        color: var(--muted);
      }
      .c-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        font-size: 11.5px;
        color: var(--muted);
      }
      .c-foot b {
        color: var(--ink);
      }
      .c-r {
        margin-left: auto;
      }
      .c-id {
        font: 11.5px var(--mono);
        color: var(--muted);
      }
      .c-ref {
        color: var(--accent);
        font-weight: 600;
        font-size: 12px;
      }
      .c-title {
        font-weight: 700;
        font-size: 15px;
        padding: 10px 14px 0;
        color: var(--ink);
      }
      .c-now {
        padding: 2px 14px 0;
        color: var(--body);
      }
      .c-wb {
        padding: 10px 14px;
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 7px 12px;
        font-size: 12.5px;
      }
      .c-wb .c-k {
        margin-top: 0;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        font-size: 12.5px;
      }
      .c-mini {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .c-bar {
        flex: 0 0 120px;
        height: 5px;
        background: var(--soft);
        border-radius: 3px;
      }
      .c-bar span {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--ok);
      }
      .c-pr {
        font: 12px var(--mono);
        margin-right: 8px;
      }
      .c-pr .good {
        color: var(--ok);
      }
      .c-pr .bad {
        color: var(--fail);
      }
      .c-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .c-chips span {
        font: 12px var(--mono);
        background: var(--soft);
        border-radius: var(--r);
        padding: 0 6px;
        color: var(--ink);
      }
      .c-chips span.h {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }
      .c-gh {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 2px;
        background: none;
        border: 0;
        font: 700 12px var(--font);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        cursor: pointer;
      }
      .c-gh .chev {
        width: 12px;
        height: 12px;
        transition: transform 0.15s;
      }
      .c-gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }
      .c-dot {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .c-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .d-body {
        padding: 16px 18px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--body);
      }
      .d-body h2 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .d-meta {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .d-who {
        font-family: var(--mono);
        color: var(--body);
      }
      .d-stages {
        display: flex;
        gap: 4px;
        margin: 14px 0 4px;
      }
      .d-stages .st {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--soft);
      }
      .d-stages .st.done {
        background: var(--ok);
      }
      .d-stages .st.cur {
        background: var(--wait);
      }
      .d-stl {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .d-stl b {
        color: var(--wait);
      }
      .d-sec {
        margin-top: 18px;
      }
      .d-sec h4 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .d-sec p {
        margin: 0;
        color: var(--ink);
      }
      .d-sec .c-chips {
        margin-top: 8px;
      }
      .d-prog {
        height: 4px;
        background: var(--soft);
        border-radius: 2px;
        margin: 0 0 6px;
      }
      .d-prog span {
        display: block;
        height: 100%;
        background: var(--ok);
        border-radius: 2px;
      }
      .d-sec .ckl ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .d-sec .ckl li {
        position: relative;
        padding: 4px 0 4px 26px;
        color: var(--ink);
        border-bottom: 1px dashed var(--line);
      }
      .d-sec .ckl li:last-child {
        border-bottom: 0;
      }
      .d-sec .ckl li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 7px;
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--line-2);
        border-radius: 3px;
      }
      .d-sec .ckl li.on {
        color: var(--body);
      }
      .d-sec .ckl li.on::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .d-sec .ckl li.on::after {
        content: '✓';
        position: absolute;
        left: 4px;
        top: 3px;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
      }
      .d-waiting {
        display: flex;
        gap: 10px;
        background: var(--wait-soft);
        border-left: 3px solid var(--wait);
        padding: 10px 12px;
        border-radius: var(--r);
        color: var(--ink);
      }
      .d-k {
        font-weight: 700;
        color: var(--wait);
        white-space: nowrap;
      }
      .d-up {
        border-left: 2px solid var(--line-2);
        margin-left: 5px;
        padding-left: 16px;
      }
      .d-u {
        margin-bottom: 12px;
        position: relative;
        color: var(--ink);
      }
      .d-u::before {
        content: '';
        position: absolute;
        left: -22px;
        top: 7px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line-2);
      }
      .d-u.last::before {
        background: var(--wait);
      }
      .d-u time,
      .d-list time {
        font: 12px var(--mono);
        color: var(--muted);
        margin-right: 8px;
      }
      .d-tag {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: var(--r);
        padding: 0 6px;
        margin-right: 6px;
      }
      .d-all {
        margin-top: 12px;
      }
      .d-empty {
        margin: 0;
        color: var(--muted);
      }
      .d-agenthead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .d-agenthead .bot {
        width: 48px;
        height: 48px;
      }
      .d-list {
        margin: 0;
        padding: 0;
        list-style: none;
        color: var(--ink);
      }
      .d-list li {
        padding: 3px 0;
      }
      @media (max-width: 900px) {
        .c-main,
        .c-main.closed {
          display: flex;
          flex-direction: column;
          overflow: auto;
        }
        .c-main > .c-pane:first-child {
          flex: none;
        }
        .c-main > .c-pane:first-child .c-scroll {
          flex-direction: row;
          overflow-x: auto;
        }
        .c-main > .c-pane:first-child .c-card {
          flex: 0 0 260px;
        }
        .c-main > .c-pane:nth-child(2) {
          flex: 1 0 auto;
        }
        .c-p3 {
          position: fixed;
          inset: var(--bar) 0 0 0;
          z-index: 5;
        }
      }
    </style>
  </head>

    <div id="root"></div>
