<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <!--BOARD_TOKENS-->
    <style>
      /* One screen: a slim bar, then three panes side by side: the agents, the work, and the detail of what was picked. Colours come from the design tokens (the style above); only the mascot keeps its own. Nothing under 13px. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --bar: 48px;
        --control: 28px;
        --r-m: calc(var(--r) + 2px);
        --line-2: #00000033;
        --shadow: 0 8px 24px #00000026;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --line-2: #ffffff33;
          color-scheme: dark;
          --face-ink: #f4f4f5;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'],
      :root[data-board-theme='dark'] {
        --line-2: #ffffff33;
        color-scheme: dark;
        --face-ink: #f4f4f5;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --line-2: #00000033;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 14px/1.5 var(--font);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
      }
      .num,
      time {
        font-variant-numeric: tabular-nums;
      }
      .sr,
      .ib .lbl {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 12px 12px;
      }

      /* The bar. */
      .bar {
        position: relative;
        flex: none;
        height: 52px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0
          max(16px, env(safe-area-inset-left, 0px));
        border-bottom: 0;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark img {
        display: block;
        height: 24px;
        width: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 20px;
        background: var(--line-2);
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .spacer {
        flex: 1;
      }
      .fresh {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .fresh-dot,
      .since-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .live-wait .fresh-dot,
      .live-big .fresh-dot {
        background: var(--wait);
      }
      .live-off .fresh-dot {
        background: var(--fail);
      }
      .since {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: var(--control);
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--soft);
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .since .since-dot {
        display: none;
        background: var(--accent);
      }
      .since.has-new .since-dot {
        display: block;
      }
      .since:hover {
        background: var(--sunk);
        color: var(--body);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .ib {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border: 0;
        border-radius: var(--r-m);
        background: none;
        color: var(--body);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.12s,
          color 0.12s;
      }
      .ib svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .ib:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .ib[aria-pressed='true'] {
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .ib.more {
        display: none;
      }

      /* One control language: pills, a segmented switch, text buttons. */
      .btn,
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: var(--control);
        box-sizing: border-box;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.12s,
          border-color 0.12s;
      }
      .btn:hover,
      .pill:hover {
        background: var(--sunk);
        border-color: var(--line);
      }
      .btn[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        margin: 0 6px 0 0;
        font: 13px var(--mono);
      }
      .btn-text {
        height: var(--control);
        padding: 0 8px;
        border: 0;
        border-radius: var(--r-m);
        background: none;
        color: var(--accent-text);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn-text:hover {
        background: var(--accent-soft);
      }
      .pill > span {
        color: var(--muted);
      }
      .pill select {
        appearance: none;
        border: 0;
        background: none;
        padding: 0 16px 0 0;
        margin-right: -18px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        max-width: 140px;
        text-overflow: ellipsis;
      }
      .pill select:focus-visible {
        outline: none;
      }
      .pill:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .pill .dn {
        width: 14px;
        height: 14px;
        color: var(--muted);
        pointer-events: none;
      }
      .pill.on {
        border-color: transparent;
        background: var(--accent-soft);
      }
      .pill.on select {
        color: var(--accent-text);
      }
      .stale-pill b {
        color: var(--muted);
        font-weight: 600;
      }
      .stale-pill[aria-pressed='true'] {
        border-color: var(--wait);
        background: var(--wait-soft);
        color: var(--wait);
      }
      .stale-pill[aria-pressed='true'] b {
        color: var(--wait);
      }
      .f-btn svg {
        width: 14px;
        height: 14px;
      }
      .f-btn b {
        min-width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 13px;
        line-height: 16px;
        text-align: center;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--soft);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .seg svg {
        width: 14px;
        height: 14px;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed='true'] {
        background: var(--bg);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
      }
      .theme svg {
        width: 16px;
        height: 16px;
      }

      /* The three panes, side by side on one surface. */
      .c-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 288px minmax(0, 1fr) 440px;
        gap: 12px;
      }
      .c-main.closed {
        grid-template-columns: 288px minmax(0, 1fr);
      }
      .c-pane {
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .c-pane + .c-pane {
        border-left: 1px solid var(--line);
      }
      .c-pane[hidden] {
        display: none;
      }
      .c-items {
        container-type: inline-size;
      }
      .c-ph {
        position: relative;
        flex: none;
        height: 48px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .c-ph h2,
      .c-pt {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .c-n {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .c-bar2 .seg {
        margin-left: 4px;
      }
      .c-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        margin-left: 8px;
        padding-left: 4px;
        border-left: 0;
      }
      .sheet-head,
      .f-btn,
      .scrim {
        display: none;
      }
      .c-grow {
        flex: 1;
        min-width: 0;
      }
      .c-x {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: var(--r-m);
        border: 0;
        background: none;
        color: var(--body);
        font-size: 15px;
        cursor: pointer;
      }
      .c-x:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .c-tg {
        margin-left: auto;
      }
      .c-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .c-empty {
        margin: 0;
        padding: 32px 24px;
        text-align: center;
        color: var(--muted);
      }
      .c-loose {
        display: block;
        width: 100%;
        min-height: 40px;
        padding: 0 16px;
        text-align: left;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
      }
      .c-loose:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .c-loose[aria-pressed='true'] {
        color: var(--ink);
        background: var(--accent-soft);
      }

      /* State: a mark and a colour that mean the same in every view. */
      .sm {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .s-you {
        color: var(--wait);
      }
      .s-blocked {
        color: var(--fail);
      }
      .s-running {
        color: var(--info);
      }
      .s-parked {
        color: var(--muted);
      }
      .s-done {
        color: var(--ok);
      }
      .state {
        vertical-align: middle;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink);
        white-space: nowrap;
        height: 22px;
        padding: 0 8px 0 6px;
        border-radius: 999px;
      }

      /* Groups of the list. */
      .c-gh {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        padding: 0 16px 0 12px;
        background: var(--bg);
        border: 0;
        border-bottom: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        padding-top: 8px;
      }
      .c-gh .chev {
        width: 12px;
        height: 12px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .c-gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }

      /* A flow or an agent as a card, a line or a table row: one hover, one selection. */
      .row,
      .cell {
        cursor: pointer;
        transition: background-color 0.12s;
      }
      .row:hover,
      .cell:hover {
        background: var(--sunk);
      }
      .row.sel,
      .row.sel:hover,
      .cell.sel,
      .cell.sel:hover {
        background: var(--accent-soft);
      }
      .row:focus-visible,
      .cell:focus-visible {
        outline-offset: -2px;
      }
      .c-card {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        margin: 0 12px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .c-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 8px;
      }
      .c-badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        border-radius: var(--r);
        padding: 0 6px;
        white-space: nowrap;
      }
      .b-stage {
        background: none;
        color: var(--body);
        box-shadow: inset 0 0 0 1px var(--line-2);
        border-radius: 999px;
        padding: 0 8px;
        line-height: 20px;
      }
      .c-head .b-ask {
        color: var(--fail);
      }
      .c-head .b-idle {
        color: var(--muted);
      }
      .c-head .b-ask,
      .c-head .b-idle {
        padding: 0;
        background: none;
      }
      .b-ask {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .b-work {
        background: var(--info-soft);
        color: var(--info);
      }
      .b-idle {
        background: var(--soft);
        color: var(--muted);
      }
      .b-wait {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .b-ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .c-head .b-ask,
      .c-head .b-idle {
        background: none;
      }
      .b-stale {
        color: var(--wait);
        box-shadow: inset 0 0 0 1px var(--wait);
        line-height: 18px;
      }
      .c-id {
        font: 13px var(--mono);
        letter-spacing: -0.02em;
        color: var(--muted);
        white-space: nowrap;
      }
      .c-ref {
        color: var(--accent-text);
        font-weight: 600;
        font-size: 13px;
      }
      .unread {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .c-title {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .c-now {
        margin-top: 2px;
        color: var(--body);
      }
      .c-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 16px;
        margin-top: 10px;
        font-size: 13px;
      }
      .m {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .k {
        color: var(--muted);
      }
      .m b {
        color: var(--ink);
        font-weight: 500;
      }
      .segs {
        display: inline-flex;
        gap: 2px;
      }
      .segs > span {
        width: 8px;
        height: 6px;
        border-radius: 1.5px;
        background: var(--line);
      }
      .segs > span.on {
        background: var(--ok);
      }
      .segs > .seg-bar {
        width: 64px;
        border-radius: 3px;
        overflow: hidden;
      }
      .seg-bar span {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .c-apps {
        display: inline-flex;
        gap: 4px;
      }
      .c-apps span {
        font-size: 13px;
        line-height: 20px;
        padding: 0 6px;
        border-radius: var(--r);
        background: var(--soft);
        color: var(--body);
      }
      .c-prs {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .c-pr {
        display: inline-flex;
        align-items: center;
        font: 13px var(--mono);
        color: var(--ink);
        white-space: nowrap;
      }
      .c-pr b {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 6px;
        font: 500 13px var(--font);
      }
      .c-pr .mk {
        margin: 0;
      }
      .c-pr .good {
        color: var(--ok);
      }
      .c-pr .bad {
        color: var(--fail);
      }
      .c-people {
        margin-top: 8px;
      }
      .c-chips {
        display: flex;
        gap: 4px 12px;
        flex-wrap: wrap;
      }
      .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: 13px;
        color: var(--body);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who i {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .who.h {
        color: var(--ink);
        font-weight: 500;
      }
      .c-wait {
        margin-top: 8px;
        font-size: 13px;
        color: var(--ink);
      }
      .c-wait .k {
        color: var(--wait);
        font-weight: 600;
      }
      .c-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .c-foot b {
        color: var(--body);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      /* Compact: one line a flow. */
      .c-line {
        display: grid;
        grid-template-columns: 14px 104px minmax(0, 1fr) auto 84px 116px 72px;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 8px;
        border-bottom: 0;
        font-size: 13px;
        margin: 0 8px;
        border-radius: 6px;
      }
      .c-lt {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-lm {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .c-ls,
      .t-steps {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--body);
      }
      .c-ago {
        text-align: right;
        color: var(--muted);
        white-space: nowrap;
        font-size: 13px;
      }

      /* Table. */
      .t-wrap {
        overflow-x: auto;
      }
      .t-work {
        width: 100%;
        min-width: 1080px;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }
      .w-code {
        width: 120px;
      }
      .w-stage {
        width: 92px;
      }
      .w-state {
        width: 108px;
      }
      .w-holder {
        width: 104px;
      }
      .w-steps {
        width: 100px;
      }
      .w-pr {
        width: 88px;
      }
      .w-tokens {
        width: 64px;
      }
      .w-due {
        width: 92px;
      }
      .w-updated {
        width: 104px;
      }
      .t-work th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }
      .t-work th button {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        height: 40px;
        padding: 0 8px;
        border: 0;
        background: none;
        color: var(--body);
        font-size: 13px;
        font-weight: 600;
        text-align: inherit;
        cursor: pointer;
      }
      .t-work th.num button {
        justify-content: flex-end;
      }
      .t-work th button:hover,
      .t-work th[aria-sort] button {
        color: var(--ink);
      }
      .sort {
        flex: none;
        width: 10px;
        height: 12px;
        opacity: 0.35;
      }
      .sort.on {
        opacity: 1;
      }
      .t-work td {
        height: 44px;
