<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <!--BOARD_TOKENS-->
    <style>
      /* One screen: a slim bar, then three panes side by side: the agents, the work, and the detail of what was picked. Colours come from the design tokens (the style above); only the mascot keeps its own. Nothing under 13px. */
      :root {
        --font: 'Inter Display','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        --mono: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --bar: 48px;
        --control: 28px;
        --r-m: calc(var(--r) + 2px);
        --line-2: #00000033;
        --shadow: 0 8px 24px #00000026;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-board-theme='light']) {
          --line-2: #ffffff33;
          color-scheme: dark;
          --face-ink: #f4f4f5;
          --cheek: #b8706a;
        }
      }
      :root[data-theme='dark'],
      :root[data-board-theme='dark'] {
        --line-2: #ffffff33;
        color-scheme: dark;
        --face-ink: #f4f4f5;
        --cheek: #b8706a;
      }
      :root[data-board-theme='light'] {
        --line-2: #00000033;
        color-scheme: light;
        --face-ink: #18181b;
        --cheek: #e8a8a0;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--ground);
        color: var(--body);
        font: 400 14px/1.5 var(--font);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--ground);
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
      }
      .num,
      time {
        font-variant-numeric: tabular-nums;
      }
      .sr,
      .ib .lbl {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 12px 12px;
      }

      /* The bar. */
      .bar {
        position: relative;
        flex: none;
        height: 52px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0
          max(16px, env(safe-area-inset-left, 0px));
        border-bottom: 0;
        min-width: 0;
      }
      .mark {
        display: block;
        line-height: 0;
        flex: none;
      }
      .mark img {
        display: block;
        height: 24px;
        width: auto;
      }
      .brule {
        flex: none;
        width: 1px;
        height: 20px;
        background: var(--line-2);
      }
      .mark:empty,
      .mark:empty + .brule {
        display: none;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .spacer {
        flex: 1;
      }
      .fresh {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .fresh-dot,
      .since-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .live-wait .fresh-dot,
      .live-big .fresh-dot {
        background: var(--wait);
      }
      .live-off .fresh-dot {
        background: var(--fail);
      }
      .since {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: var(--control);
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--soft);
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
      }
      .since b {
        color: var(--ink);
        font-weight: 600;
      }
      .since .since-dot {
        display: none;
        background: var(--accent);
      }
      .since.has-new .since-dot {
        display: block;
      }
      .since:hover {
        background: var(--sunk);
        color: var(--body);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .ib {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 32px;
        height: 32px;
        padding: 0 6px;
        border: 0;
        border-radius: var(--r-m);
        background: none;
        color: var(--body);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.12s,
          color 0.12s;
      }
      .ib svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .ib:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .ib[aria-pressed='true'] {
        background: var(--accent-soft);
        color: var(--accent-text);
      }
      .ib.more {
        display: none;
      }

      /* One control language: pills, a segmented switch, text buttons. */
      .btn,
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: var(--control);
        box-sizing: border-box;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.12s,
          border-color 0.12s;
      }
      .btn:hover,
      .pill:hover {
        background: var(--sunk);
        border-color: var(--line);
      }
      .btn[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn.chip {
        height: 24px;
        padding: 0 8px;
        margin: 0 6px 0 0;
        font: 13px var(--mono);
      }
      .btn-text {
        height: var(--control);
        padding: 0 8px;
        border: 0;
        border-radius: var(--r-m);
        background: none;
        color: var(--accent-text);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn-text:hover {
        background: var(--accent-soft);
      }
      .pill > span {
        color: var(--muted);
      }
      .pill select {
        appearance: none;
        border: 0;
        background: none;
        padding: 0 16px 0 0;
        margin-right: -18px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        max-width: 140px;
        text-overflow: ellipsis;
      }
      .pill select:focus-visible {
        outline: none;
      }
      .pill:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .pill .dn {
        width: 14px;
        height: 14px;
        color: var(--muted);
        pointer-events: none;
      }
      .pill.on {
        border-color: transparent;
        background: var(--accent-soft);
      }
      .pill.on select {
        color: var(--accent-text);
      }
      .stale-pill b {
        color: var(--muted);
        font-weight: 600;
      }
      .stale-pill[aria-pressed='true'] {
        border-color: var(--wait);
        background: var(--wait-soft);
        color: var(--wait);
      }
      .stale-pill[aria-pressed='true'] b {
        color: var(--wait);
      }
      .f-btn svg {
        width: 14px;
        height: 14px;
      }
      .f-btn b {
        min-width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 13px;
        line-height: 16px;
        text-align: center;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 8px;
        background: var(--soft);
      }
      .seg button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .seg svg {
        width: 14px;
        height: 14px;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed='true'] {
        background: var(--bg);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
      }
      .theme svg {
        width: 16px;
        height: 16px;
      }

      /* The three panes, side by side on one surface. */
      .c-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 288px minmax(0, 1fr) 440px;
        gap: 12px;
      }
      .c-main.closed {
        grid-template-columns: 288px minmax(0, 1fr);
      }
      .c-pane {
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .c-pane + .c-pane {
        border-left: 1px solid var(--line);
      }
      .c-pane[hidden] {
        display: none;
      }
      .c-items {
        container-type: inline-size;
      }
      .c-ph {
        position: relative;
        flex: none;
        height: 48px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .c-ph h2,
      .c-pt {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
      }
      .c-n {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .c-bar2 .seg {
        margin-left: 4px;
      }
      .c-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        margin-left: 8px;
        padding-left: 4px;
        border-left: 0;
      }
      .sheet-head,
      .f-btn,
      .scrim {
        display: none;
      }
      .c-grow {
        flex: 1;
        min-width: 0;
      }
      .c-x {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: var(--r-m);
        border: 0;
        background: none;
        color: var(--body);
        font-size: 15px;
        cursor: pointer;
      }
      .c-x:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .c-tg {
        margin-left: auto;
      }
      .c-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .c-empty {
        margin: 0;
        padding: 32px 24px;
        text-align: center;
        color: var(--muted);
      }
      .c-loose {
        display: block;
        width: 100%;
        min-height: 40px;
        padding: 0 16px;
        text-align: left;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
      }
      .c-loose:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .c-loose[aria-pressed='true'] {
        color: var(--ink);
        background: var(--accent-soft);
      }

      /* State: a mark and a colour that mean the same in every view. */
      .sm {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .s-you {
        color: var(--wait);
      }
      .s-blocked {
        color: var(--fail);
      }
      .s-running {
        color: var(--info);
      }
      .s-parked {
        color: var(--muted);
      }
      .s-done {
        color: var(--ok);
      }
      .state {
        vertical-align: middle;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink);
        white-space: nowrap;
        height: 22px;
        padding: 0 8px 0 6px;
        border-radius: 999px;
      }

      /* Groups of the list. */
      .c-gh {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        padding: 0 16px 0 12px;
        background: var(--bg);
        border: 0;
        border-bottom: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        padding-top: 8px;
      }
      .c-gh .chev {
        width: 12px;
        height: 12px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .c-gh[aria-expanded='false'] .chev {
        transform: rotate(-90deg);
      }

      /* A flow or an agent as a card, a line or a table row: one hover, one selection. */
      .row,
      .cell {
        cursor: pointer;
        transition: background-color 0.12s;
      }
      .row:hover,
      .cell:hover {
        background: var(--sunk);
      }
      .row.sel,
      .row.sel:hover,
      .cell.sel,
      .cell.sel:hover {
        background: var(--accent-soft);
      }
      .row:focus-visible,
      .cell:focus-visible {
        outline-offset: -2px;
      }
      .c-card {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        margin: 0 12px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .c-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 8px;
      }
      .c-badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        border-radius: var(--r);
        padding: 0 6px;
        white-space: nowrap;
      }
      .b-stage {
        background: none;
        color: var(--body);
        box-shadow: inset 0 0 0 1px var(--line-2);
        border-radius: 999px;
        padding: 0 8px;
        line-height: 20px;
      }
      .c-head .b-ask {
        color: var(--fail);
      }
      .c-head .b-idle {
        color: var(--muted);
      }
      .c-head .b-ask,
      .c-head .b-idle {
        padding: 0;
        background: none;
      }
      .b-ask {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .b-work {
        background: var(--info-soft);
        color: var(--info);
      }
      .b-idle {
        background: var(--soft);
        color: var(--muted);
      }
      .b-wait {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .b-ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .c-head .b-ask,
      .c-head .b-idle {
        background: none;
      }
      .b-stale {
        color: var(--wait);
        box-shadow: inset 0 0 0 1px var(--wait);
        line-height: 18px;
      }
      .c-id {
        font: 13px var(--mono);
        letter-spacing: -0.02em;
        color: var(--muted);
        white-space: nowrap;
      }
      .c-order {
        margin-right: 6px;
        font-weight: 600;
        color: var(--ink);
      }
      .c-ref {
        color: var(--accent-text);
        font-weight: 600;
        font-size: 13px;
      }
      .unread {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .c-title {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .c-now {
        margin-top: 2px;
        color: var(--body);
      }
      .c-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 16px;
        margin-top: 10px;
        font-size: 13px;
      }
      .m {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .k {
        color: var(--muted);
      }
      .m b {
        color: var(--ink);
        font-weight: 500;
      }
      .segs {
        display: inline-flex;
        gap: 2px;
      }
      .segs > span {
        width: 8px;
        height: 6px;
        border-radius: 1.5px;
        background: var(--line);
      }
      .segs > span.on {
        background: var(--ok);
      }
      .segs > .seg-bar {
        width: 64px;
        border-radius: 3px;
        overflow: hidden;
      }
      .seg-bar span {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .c-apps {
        display: inline-flex;
        gap: 4px;
      }
      .c-apps span {
        font-size: 13px;
        line-height: 20px;
        padding: 0 6px;
        border-radius: var(--r);
        background: var(--soft);
        color: var(--body);
      }
      .c-prs {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px 12px;
      }
      .c-pr {
        display: inline-flex;
        align-items: center;
        font: 13px var(--mono);
        color: var(--ink);
        white-space: nowrap;
      }
      .c-pr b {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 6px;
        font: 500 13px var(--font);
      }
      .c-pr .mk {
        margin: 0;
      }
      .c-pr .good {
        color: var(--ok);
      }
      .c-pr .bad {
        color: var(--fail);
      }
      .c-people {
        margin-top: 8px;
      }
      .c-chips {
        display: flex;
        gap: 4px 12px;
        flex-wrap: wrap;
      }
      .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: 13px;
        color: var(--body);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who i {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .who.h {
        color: var(--ink);
        font-weight: 500;
      }
      .c-wait {
        margin-top: 8px;
        font-size: 13px;
        color: var(--ink);
      }
      .c-wait .k {
        color: var(--wait);
        font-weight: 600;
      }
      .c-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .c-foot b {
        color: var(--body);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      /* Compact: one line a flow. */
      .c-line {
        display: grid;
        grid-template-columns: 14px minmax(128px, max-content) minmax(0, 1fr) auto 84px 116px 92px;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 8px;
        border-bottom: 0;
        font-size: 13px;
        margin: 0 8px;
        border-radius: 6px;
      }
      .c-lt {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-lm {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .c-ls,
      .t-steps {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--body);
      }
      .c-ago {
        text-align: right;
        color: var(--muted);
        white-space: nowrap;
        font-size: 13px;
      }

      /* Table. */
      .t-wrap {
        overflow-x: auto;
      }
      .t-work {
        width: 100%;
        min-width: 1500px;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
        /* how far the Code column stays from the left: the width of the Order column */
        --order-width: 64px;
      }
      .w-order {
        width: var(--order-width);
      }
      .w-code {
        font: 13px var(--mono);
        width: calc(17ch + 24px);
      }
      .w-stage {
        width: 92px;
      }
      .w-state {
        width: 124px;
      }
      .w-holder {
        width: 104px;
      }
      .w-steps {
        width: 100px;
      }
      .w-pr {
        width: 88px;
      }
      .w-read,
      .w-written {
        width: 150px;
      }
      .t-work td.t-tk {
        line-height: 16px;
      }
      .t-work td.t-tk small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
        color: var(--muted);
      }
      /* Order and Code stay at the left while the table scrolls sideways. */
      .t-work td:nth-child(1),
      .t-work td:nth-child(2) {
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--bg);
      }
      .t-work th:nth-child(1),
      .t-work th:nth-child(2) {
        left: 0;
        z-index: 2;
      }
      .t-work td:nth-child(2),
      .t-work th:nth-child(2) {
        left: var(--order-width);
      }
      .t-work tr.sel td:nth-child(1),
      .t-work tr.sel td:nth-child(2) {
        background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--bg);
      }
      .t-work tr.row:not(.sel):hover td:nth-child(1),
      .t-work tr.row:not(.sel):hover td:nth-child(2) {
        background: linear-gradient(var(--sunk), var(--sunk)), var(--bg);
      }
      .w-due {
        width: 92px;
      }
      .w-updated {
        width: 104px;
      }
      .t-work th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }
      .t-work th button {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        height: 40px;
        padding: 0 8px;
        border: 0;
        background: none;
        color: var(--body);
        font-size: 13px;
        font-weight: 600;
        text-align: inherit;
        cursor: pointer;
      }
      .t-work th.num button {
        justify-content: flex-end;
      }
      .t-work th button:hover,
      .t-work th[aria-sort] button {
        color: var(--ink);
      }
      .sort {
        flex: none;
        width: 10px;
        height: 12px;
        opacity: 0.35;
      }
      .sort.on {
        opacity: 1;
      }
      .t-work td {
        height: 44px;
        box-sizing: border-box;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .t-work td.c-order-cell {
        font: 600 13px var(--mono);
      }
      .t-work td:first-child,
      .t-work th:first-child button {
        padding-left: 16px;
      }
      .t-work .num {
        text-align: right;
      }
      .t-title div {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .t-title span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }
      .t-work .c-pr b {
        font-size: 0;
        margin-left: 4px;
      }
      .t-work .c-pr .mk {
        width: 12px;
        height: 12px;
      }

      /* Agents. */
      .cell {
        margin: 8px 12px 0;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .cell .c-head {
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 10px;
      }
      .c-compact {
        display: flex;
        align-items: center;
        gap: 4px 10px;
        padding: 6px 16px;
      }
      .c-compact .c-face {
        width: 36px;
        height: 32px;
      }
      .c-face {
        width: 44px;
        height: 40px;
        flex: none;
      }
      .c-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 8px;
      }
      .c-nm {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-role {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .c-body {
        display: grid;
        gap: 4px;
        margin-top: 8px;
        font-size: 13px;
      }
      .a-line {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--ink);
      }
      .a-line .c-k {
        color: var(--muted);
        font-weight: 500;
      }
      .a-line small {
        color: var(--muted);
        font-size: 13px;
      }
      .cell .c-foot {
        margin-top: 8px;
      }
      .c-ask {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--fail);
      }

      /* The mascots: solid colour, thick outline, round hands. Motion is cheap keyframes and stops for reduced motion. */
      .bot {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .m-o {
        stroke: var(--face-ink);
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .m-line {
        fill: none;
      }
      .m-ink {
        fill: var(--face-ink);
      }
      .m-bad {
        stroke: var(--fail);
      }
      .m-shadow {
        opacity: 0.12;
      }
      .m-q {
        font: 900 13px system-ui;
        fill: #1f1f1f;
      }
      .m-hoe {
        transform-origin: 26px 22px;
        animation: m-swing 1.1s cubic-bezier(0.55, 0, 0.35, 1) infinite;
      }
      .m-dig {
        transform-origin: 20px 36px;
        animation: m-dig 1.1s ease-in-out infinite;
      }
      .m-squint {
        transform-origin: 20px 23px;
        animation: m-squint 1.1s ease-in-out infinite;
      }
      .m-clod {
        opacity: 0;
        animation: m-clod 1.1s ease-out infinite;
      }
      .m-c2 {
        animation-name: m-clod2;
      }
      .m-c3 {
        animation-name: m-clod3;
      }
      .m-sleep {
        transform-origin: 20px 36px;
        animation: m-breathe 3s ease-in-out infinite;
      }
      .m-snot {
        transform-origin: 24.5px 29px;
        animation: m-snot 3s ease-in-out infinite;
      }
      .m-zz {
        font: 900 9px system-ui;
        fill: #3b4cca;
        opacity: 0;
        animation: m-zz 3s ease-in-out infinite;
      }
      .m-z2 {
        font-size: 11px;
        animation-delay: 1s;
      }
      .m-z3 {
        font-size: 13px;
        animation-delay: 2s;
      }
      .m-bubble {
        transform-origin: 35px 6px;
        animation: m-pop 1.8s ease-in-out infinite;
      }
      .m-lean {
        transform-origin: 20px 36px;
        animation: m-lean 1.8s ease-in-out infinite;
      }
      .m-wave {
        transform-origin: 33px 26px;
        animation: m-wave 0.9s ease-in-out infinite;
      }
      @keyframes m-swing {
        0%,
        38% {
          transform: rotate(-118deg);
        }
        56% {
          transform: rotate(4deg);
        }
        62% {
          transform: rotate(-6deg);
        }
        70% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(-118deg);
        }
      }
      @keyframes m-dig {
        0%,
        38% {
          transform: scale(1, 1) translateY(-1px);
        }
        56% {
          transform: scale(1.07, 0.92);
        }
        66% {
          transform: scale(0.98, 1.03);
        }
        100% {
          transform: scale(1, 1) translateY(-1px);
        }
      }
      @keyframes m-squint {
        0%,
        50% {
          transform: scaleY(1);
        }
        56%,
        64% {
          transform: scaleY(0.35);
        }
        72%,
        100% {
          transform: scaleY(1);
        }
      }
      @keyframes m-clod {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(7px, -11px);
        }
      }
      @keyframes m-clod2 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(11px, -5px);
        }
      }
      @keyframes m-clod3 {
        0%,
        55% {
          opacity: 0;
          transform: translate(0, 0);
        }
        58% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(2px, -13px);
        }
      }
      @keyframes m-breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.05, 0.95);
        }
      }
      @keyframes m-snot {
        0%,
        8% {
          transform: scale(0.15);
          opacity: 0.9;
        }
        50% {
          transform: scale(1);
          opacity: 0.9;
        }
        88% {
          transform: scale(1.15);
          opacity: 0.9;
        }
        92% {
          transform: scale(1.35);
          opacity: 0;
        }
        100% {
          transform: scale(0.15);
          opacity: 0;
        }
      }
      @keyframes m-zz {
        0% {
          opacity: 0;
          transform: translate(0, 0);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(9px, -14px);
        }
      }
      @keyframes m-pop {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.14);
        }
        24% {
          transform: scale(0.96);
        }
        34% {
          transform: scale(1);
        }
      }
      @keyframes m-lean {
        0%,
        100% {
          transform: rotate(0);
        }
        12% {
          transform: rotate(-5deg) translateY(-2px);
        }
        34% {
          transform: rotate(0);
        }
      }
      @keyframes m-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-28deg);
        }
      }
      /* Detail. */
      .d-body {
        padding: 20px;
        line-height: 1.6;
        color: var(--body);
      }
      .d-body h2 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
        overflow-wrap: anywhere;
      }
      .d-meta {
        display: flex;
        gap: 4px 12px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      .d-who {
        color: var(--ink);
        font-weight: 500;
      }
      .d-stages {
        display: flex;
        gap: 3px;
        margin: 16px 0 6px;
      }
      .d-stages .st {
        flex: 1;
        height: 6px;
        border-radius: 2px;
        background: var(--soft);
      }
      .d-stages .st.done {
        background: var(--ok);
      }
      .d-stages .st.cur {
        background: var(--wait);
      }
      .d-stl {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }
      .d-stl b {
        color: var(--ink);
        font-weight: 600;
      }
      .d-sec {
        margin-top: 24px;
      }
      .d-sec h3 {
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .d-sec p {
        margin: 0;
        color: var(--ink);
      }
      .d-sec .c-chips {
        margin-top: 8px;
      }
      .d-sec > .c-bar {
        margin: 0 0 8px;
      }
      .d-tokens {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .d-tokens th,
      .d-tokens td {
        padding: 6px 0 6px 12px;
        text-align: right;
        border-bottom: 1px solid var(--line);
        font-weight: 400;
        color: var(--ink);
      }
      .d-tokens thead th {
        color: var(--muted);
      }
      .d-tokens th[scope='row'] {
        padding-left: 0;
        text-align: left;
      }
      .d-tokens td {
        vertical-align: top;
      }
      .d-tokens small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .d-fields {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .d-fields summary {
        cursor: pointer;
      }
      .d-fields p {
        margin: 8px 0;
      }
      .d-fields h4 {
        margin: 10px 0 4px;
        font-size: 13px;
        color: var(--ink);
      }
      .d-fields dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .d-fields dt {
        overflow-wrap: anywhere;
        font-family: var(--mono);
        font-size: 12px;
      }
      .d-fields dd {
        margin: 0;
        text-align: right;
        color: var(--ink);
      }
      .ckl ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .ckl li {
        position: relative;
        padding: 6px 0 6px 26px;
        color: var(--ink);
        border-bottom: 1px solid var(--line);
      }
      .ckl li:last-child {
        border-bottom: 0;
      }
      .ckl li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 10px;
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 1.5px solid var(--line-2);
        border-radius: 3px;
      }
      .ckl li.on {
        color: var(--muted);
      }
      .ckl li.on::before {
        background: var(--ok);
        border-color: var(--ok);
      }
      .ckl li.on::after {
        content: '';
        position: absolute;
        left: 4.5px;
        top: 12px;
        width: 4px;
        height: 7px;
        border: solid var(--bg);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .d-waiting {
        display: flex;
        gap: 12px;
        padding: 10px 12px;
        border-radius: var(--r);
        background: var(--wait-soft);
        color: var(--ink);
      }
      .d-k {
        font-weight: 600;
        color: var(--wait);
        white-space: nowrap;
      }
      .d-up {
        border-left: 1px solid var(--line-2);
        margin-left: 4px;
        padding-left: 16px;
      }
      .d-u {
        position: relative;
        margin-bottom: 10px;
        color: var(--ink);
      }
      .d-u::before {
        content: '';
        position: absolute;
        left: -20.5px;
        top: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line-2);
      }
      .d-u.last::before {
        background: var(--wait);
      }
      .d-u time,
      .d-list time {
        font: 13px var(--mono);
        color: var(--muted);
        margin-right: 8px;
      }
      .d-tag {
        font-size: 13px;
        font-weight: 500;
        color: var(--accent-text);
        background: var(--accent-soft);
        border-radius: var(--r);
        padding: 0 6px;
        margin-right: 6px;
      }
      .d-all {
        margin-top: 16px;
      }
      .d-empty {
        margin: 0;
        color: var(--muted);
      }
      .d-note {
        margin-left: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .d-agenthead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .d-agenthead .bot {
        width: 68px;
        height: 60px;
        flex: none;
      }
      .d-list {
        margin: 0;
        padding: 0;
        list-style: none;
        color: var(--ink);
      }
      .d-list li {
        padding: 4px 0;
      }
      .d-list a {
        color: var(--accent-text);
        font-family: var(--mono);
        font-size: 13px;
      }
      .mk {
        width: 10px;
        height: 10px;
        flex: none;
        margin: 0 6px;
      }
      .mk.x {
        color: var(--fail);
      }
      .mk.v {
        color: var(--ok);
      }
      .evs {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .ev {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        column-gap: 10px;
      }
      .ev .tm {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .ev .who {
        font-size: 13px;
        color: var(--muted);
      }
      .ev .who b {
        font: 500 13px var(--mono);
        color: var(--ink);
      }
      .ev .ev-text {
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .ev.fail .ev-text {
        color: var(--fail);
      }
      .ev .lk {
        font-size: 13px;
        color: var(--accent-text);
        text-decoration: none;
        word-break: break-all;
      }
      .ev .lk:hover {
        text-decoration: underline;
      }
      .ev .src {
        font-size: 13px;
        color: var(--muted);
      }
      .keys {
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 0px));
        top: calc(var(--bar) + env(safe-area-inset-top, 0px));
        z-index: 20;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 12px 16px;
        width: 260px;
      }
      .keys h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .keys dl {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
      }
      .keys dt {
        font-family: var(--mono);
        color: var(--ink);
      }
      .keys dd {
        margin: 0;
      }
      /* Filled pills, the group counts, the state pills and the picked card: after the base rules, which they refine. */
      .pill {
        border-color: transparent;
        background: var(--soft);
        border-radius: 8px;
      }
      .c-gh .c-n {
        min-width: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--soft);
        text-align: center;
        line-height: 20px;
      }
      .c-card.sel {
        border-color: var(--accent);
      }
      .st-you {
        background: var(--wait-soft);
        color: var(--wait);
      }
      .st-blocked {
        background: var(--fail-soft);
        color: var(--fail);
      }
      .st-running {
        background: var(--info-soft);
        color: var(--info);
      }
      .st-parked {
        background: var(--soft);
        color: var(--muted);
      }
      .st-done {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .row.sel td:first-child {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .cell.sel {
        border-color: var(--accent);
      }
      /* A narrow work pane (the detail open, a tablet): the filters fold into one button and a panel. */
      @container (max-width: 820px) {
        .seg .lbl {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        }
      }
      @container (max-width: 760px) {
        .f-btn {
          display: inline-flex;
          margin-left: auto;
        }
        .c-tools {
          display: none;
        }
        .c-tools.open {
          display: flex;
          position: absolute;
          top: calc(100% + 4px);
          right: 8px;
          z-index: 20;
          flex-direction: column;
          align-items: stretch;
          width: 280px;
          margin: 0;
          padding: 12px;
          gap: 8px;
          border: 1px solid var(--line-2);
          border-radius: 10px;
          background: var(--bg);
          box-shadow: var(--shadow);
        }
        .c-tools.open .sheet-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          color: var(--ink);
        }
        .c-tools.open .pill {
          justify-content: space-between;
          height: 36px;
          border-radius: 8px;
        }
        .c-tools.open .pill select {
          flex: 1;
          max-width: none;
          text-align: right;
        }
      }

      .c-line .who {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* A work pane too narrow for one line: the title on its own line, the rest under it. */
      @container (max-width: 900px) {
        .c-line {
          display: flex;
          flex-wrap: wrap;
          gap: 2px 8px;
          height: auto;
          padding: 8px;
        }
        /* the first line: the state mark and the title */
        .c-line .c-lt {
          order: 1;
          flex: 0 0 calc(100% - 22px);
        }
        /* the second line, indented under the title: the code, then the rest */
        .c-line .c-id {
          order: 2;
          margin-left: 22px;
        }
        .c-line .c-lm,
        .c-line .c-ls,
        .c-line .who,
        .c-line .c-ago {
          order: 3;
        }
        /* a long holder is cut, so the time stays on the second line */
        .c-line .who {
          display: block;
          flex: 1 1 0;
        }
        .c-line .who i {
          display: inline-block;
          margin-right: 6px;
        }
        .c-line .c-lm {
          justify-content: flex-start;
        }
        .c-line .c-ago {
          margin-left: auto;
        }
      }

      /* A tablet or a phone: one column, the work first; the detail opens over it. */
      @media (max-width: 900px) {
        body {
          overflow: auto;
        }
        .app {
          height: auto;
          min-height: 100%;
        }
        .c-main,
        .c-main.closed {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .c-items {
          order: -1;
        }
        .c-pane {
          flex: none;
          overflow: visible;
        }
        .c-scroll {
          overflow: visible;
        }
        #dock .c-scroll {
          max-height: 50vh;
          overflow: auto;
        }
        .c-p3 {
          position: fixed;
          inset: 0;
          z-index: 25;
          border: 0;
